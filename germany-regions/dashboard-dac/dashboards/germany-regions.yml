      # Net migration by state, 2025 (moves in minus moves out per 1,000 residents)

      **Brandenburg gained most (+6.5 per 1,000); Thüringen is the only state with a net loss (-0.3).**

      **Map:** white = lowest, dark blue = highest. **Bars:** sorted highest to lowest; dashed line = Germany.
- tab: Society
  height: 600
  widgets:
  - name: Map - Net migration, 2025 (per 1,000 residents)
    type: chart
    chart: vega-lite
    col: 6
    sql: |
      SELECT nuts1_id, state_name, map_label, label_lon, label_lat, value, value_label, reference_period,
        rank_desc, germany_value_label, diff_to_germany_label
      FROM `bruin-playground-arsalan.report.de_state_indicator_snapshot`
      WHERE indicator_id = 'net_migration_per_1000'
    spec:
      projection:
        type: mercator
      datasets:
        states: *id001
      layer:
      - transform:
        - lookup: nuts1_id
          from:
            data:
              name: states
            key: properties.nuts1_id
          as: geo
        mark:
          type: geoshape
          stroke: '#0b0e14'
          strokeWidth: 0.8
          strokeJoin: round
        encoding:
          shape:
            field: geo
            type: geojson
          fill:
            field: value
            type: quantitative
            scale:
              range:
              - '#f7fbff'
              - '#deebf7'
              - '#c6dbef'
              - '#9ecae1'
              - '#6baed6'
              - '#4292c6'
              - '#2171b5'
              - '#08519c'
              - '#08306b'
            legend:
              title: per 1,000 residents
              format: .1f
              orient: right
              gradientLength: 260
              titlePadding: 10
          tooltip:
          - field: state_name
            title: State
