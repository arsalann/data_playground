name: Bruin Shop Marketing
description: Paid media, email, web-channel conversion, and attributed revenue analysis.
connection: bruin-playground-arsalan
theme: ibm-cb-dark

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: channel
    type: select
    default: All channels
    options:
      values: [All channels, Paid social, Paid search, Email, Organic search, Direct]

rows:
  - widgets:
      - name: Marketing overview
        type: text
        col: 12
        content: |
          # Marketing and web acquisition, 2025-01-01 to 2026-06-05

          This page compares paid search, paid social, email, organic search, and direct traffic. The generated data uses one shared funnel, so spend, impressions, clicks, sessions, conversions, orders, revenue, COGS, shipping, and contribution profit reconcile by channel and market.

  - widgets:
      - name: Paid spend
        type: metric
        col: 3
        column: value
        prefix: "$"
        format: number
        sql: |
          SELECT ROUND(SUM(total_spend), 2) AS value
          FROM `bruin-playground-arsalan.reports.rpt_marketing_roi`
          WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND channel IN ('paid_search', 'paid_ads')
            AND (
              '{{ filters.channel }}' = 'All channels'
              OR channel = CASE '{{ filters.channel }}'
                WHEN 'Paid social' THEN 'paid_ads'
                WHEN 'Paid search' THEN 'paid_search'
                WHEN 'Email' THEN 'email'
                WHEN 'Organic search' THEN 'organic_search'
                WHEN 'Direct' THEN 'direct'
              END
            )

      - name: Attributed revenue
        type: metric
        col: 3
        column: value
        prefix: "$"
        format: number
        sql: |
          SELECT ROUND(SUM(attributed_revenue), 2) AS value
          FROM `bruin-playground-arsalan.reports.rpt_marketing_roi`
          WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND (
              '{{ filters.channel }}' = 'All channels'
              OR channel = CASE '{{ filters.channel }}'
                WHEN 'Paid social' THEN 'paid_ads'
                WHEN 'Paid search' THEN 'paid_search'
                WHEN 'Email' THEN 'email'
                WHEN 'Organic search' THEN 'organic_search'
                WHEN 'Direct' THEN 'direct'
              END
            )

      - name: Paid ROAS
        type: metric
        col: 3
        column: value
        suffix: "x"
        format: number
        sql: |
          SELECT ROUND(SAFE_DIVIDE(SUM(attributed_revenue), NULLIF(SUM(total_spend), 0)), 2) AS value
          FROM `bruin-playground-arsalan.reports.rpt_marketing_roi`
          WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND channel IN ('paid_search', 'paid_ads')
            AND (
              '{{ filters.channel }}' = 'All channels'
              OR channel = CASE '{{ filters.channel }}'
                WHEN 'Paid social' THEN 'paid_ads'
                WHEN 'Paid search' THEN 'paid_search'
                WHEN 'Email' THEN 'email'
                WHEN 'Organic search' THEN 'organic_search'
                WHEN 'Direct' THEN 'direct'
              END
            )

      - name: Web sessions
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT SUM(total_sessions) AS value
          FROM `bruin-playground-arsalan.staging.stg_web_sessions`
          WHERE session_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND (
              '{{ filters.channel }}' = 'All channels'
              OR channel = CASE '{{ filters.channel }}'
                WHEN 'Paid social' THEN 'paid_ads'
                WHEN 'Paid search' THEN 'paid_search'
                WHEN 'Email' THEN 'email'
                WHEN 'Organic search' THEN 'organic_search'
                WHEN 'Direct' THEN 'direct'
              END
            )

  - widgets:
      - name: Paid ROAS header
        type: text
        col: 12
        content: |
          # Daily paid search and paid social ROAS, 2025-01-01 to 2026-06-05

          **Paid social and paid search both clear profitable acquisition economics in the generated data: paid social delivers 3.80x ROAS and $4.0M contribution profit, while paid search delivers 3.64x ROAS and $1.6M contribution profit.**

          **X-axis:** calendar day. **Y-axis:** ROAS ratio. **Lines:** paid search and paid social; the legend names both series.

  - widgets:
      - name: Daily paid media ROAS
        type: chart
        chart: combo
        col: 12
        file: queries/daily_paid_media_roas.sql
        x: day_label
        y: [paid_search_roas, paid_social_roas]
        lines: [paid_search_roas, paid_social_roas]

  - widgets:
      - name: Paid ROAS footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Google Ads**, **Meta Ads**, **GA4**, and **Shopify** data through `reports.rpt_marketing_roi`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** ROAS is generated from exact synthetic order attribution, not observed platform measurement. The fake data has no user-level campaign path, auction dynamics, incrementality measurement, or real privacy/attribution loss.

  - widgets:
      - name: Paid social market funnel header
        type: text
        col: 12
        content: |
          # Paid social market funnel, top US markets, May 2025

          **The generated New York paid-social campaign matches the requested order of magnitude: $31.0K spend, 1.03M impressions, 1.99% CTR, 2,062 platform conversions, 1,975 paid orders, $95.8K revenue, and $12.9K contribution profit.**

          **Columns:** market, spend, impressions, CTR, clicks, platform conversions, paid orders, revenue, AOV, COGS, shipping cost, and contribution profit.

  - widgets:
      - name: Paid social market funnel
        type: table
        col: 12
        file: queries/paid_social_market_funnel_may2025.sql
        columns:
          - { name: market, label: Market }
          - { name: spend_usd, label: "Spend (USD)", format: number }
          - { name: impressions, label: Impressions, format: number }
          - { name: ctr_pct, label: "CTR (%)", format: number }
          - { name: clicks, label: Clicks, format: number }
          - { name: platform_conversions, label: Platform conversions, format: number }
          - { name: paid_orders, label: Paid orders, format: number }
          - { name: revenue_usd, label: "Revenue (USD)", format: number }
          - { name: avg_order_value_usd, label: "AOV (USD)", format: number }
          - { name: cogs_usd, label: "COGS (USD)", format: number }
          - { name: shipping_cost_usd, label: "Shipping cost (USD)", format: number }
          - { name: contribution_profit_usd, label: "Contribution profit (USD)", format: number }

  - widgets:
      - name: Paid social market funnel footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Meta Ads**, **GA4**, and **Shopify** order data generated from `raw.marketing_funnel` and standardized in staging tables.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Market-level rows are generated from deterministic weights and city-level seasonality, not observed media delivery. Paid orders exclude pending and voided orders, so they can be slightly lower than platform conversions.

  - widgets:
      - name: Web conversion header
        type: text
        col: 12
        content: |
          # Web-channel conversion rate (%), 2025-01-01 to 2026-06-05

          **The generated funnel creates higher conversion rates for intent-heavy paid and email traffic and lower rates for organic and direct traffic. The dashboard-wide average conversion rate is 5.24%, but the spread is a generator design choice rather than an observed performance claim.**

          **X-axis:** channel. **Y-axis:** purchase events divided by sessions, expressed as a percentage. **Bars:** conversion rate by channel.

  - widgets:
      - name: Web channel conversion rate
        type: chart
        chart: bar
        col: 12
        file: queries/web_channel_conversion.sql
        x: channel
        y: [conversion_rate_pct]

  - widgets:
      - name: Web conversion footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **GA4** sessions and purchase events in `staging.stg_web_sessions`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Purchase events are generated at channel and market level, not tracked user journeys. The conversion-rate differences should be treated as synthetic scenario design, not statistically meaningful observed behavior.

  - widgets:
      - name: Channel table header
        type: text
        col: 12
        content: |
          # Channel performance detail, 2025-01-01 to 2026-06-05

          **Paid social is the largest paid acquisition engine by spend and orders, while organic search contributes $5.1M of no-media-spend revenue. Contribution profit separates revenue quality from spend efficiency by subtracting COGS, shipping, and media spend.**

          **Columns:** channel, spend, attributed revenue, contribution profit, ROAS, CPA, CTR, conversion rate, orders, impressions, clicks, conversions, sessions, and new users.

  - widgets:
      - name: Channel performance detail
        type: table
        col: 12
        file: queries/channel_performance_table.sql
        columns:
          - { name: channel, label: Channel }
          - { name: spend_usd, label: "Spend (USD)", format: number }
          - { name: attributed_revenue_usd, label: "Attributed revenue (USD)", format: number }
          - { name: contribution_profit_usd, label: "Contribution profit (USD)", format: number }
          - { name: roas, label: "ROAS (x)", format: number }
          - { name: cost_per_acquisition_usd, label: "CPA (USD)", format: number }
          - { name: click_through_rate_pct, label: "CTR (%)", format: number }
          - { name: conversion_rate_pct, label: "Conversion rate (%)", format: number }
          - { name: orders, label: Orders, format: number }
          - { name: impressions, label: Impressions, format: number }
          - { name: clicks, label: Clicks, format: number }
          - { name: platform_conversions, label: Platform conversions, format: number }
          - { name: sessions, label: Sessions, format: number }
          - { name: new_users, label: New users, format: number }

  - widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          # Methodology

          `raw.marketing_funnel` generates channel, campaign, date, state, and city facts for paid social, paid search, email, organic search, and direct traffic. `staging.stg_marketing_spend` combines fake Meta Ads, Google Ads, and Klaviyo activity. `staging.stg_web_sessions` normalizes GA4 sources. `reports.rpt_marketing_roi` joins spend, sessions, and exact generated Shopify-style order attribution by channel. Paid ROAS excludes email, direct, and organic search because those channels have no media spend in this template.
