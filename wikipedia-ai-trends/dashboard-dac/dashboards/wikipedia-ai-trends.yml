      - name: Small-multiples legend
        type: text
        col: 3
        content: |
          ### Reading the grid

          Each panel shows one top-level subject; lines inside are that
          subject's top sub-subjects (≥5 articles, capped at 8 by latest
          share). Y-axis is per-panel, so **vertical scale differs** between
          panels — a steep line in *History* is at a much lower absolute
          level than a steep line in *Mathematics*. Compare shapes, not
          heights. For absolute levels, see the summary table directly
          above.

  - widgets:
      - name: Per-subject small multiples footnote
        type: text
        col: 12
        content: |
          **Sources.** Per-article AI-reference counts from
          `bruin-playground-arsalan.staging.wat_ai_reference_counts`, joined
          back to the **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          sub-subject taxonomy. Subject-level latest shares in the summary
          table from `report.wat_category_metrics`. Article wikilinks fetched
          via the **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** Each panel's y-range is fit to its own data, so
          vertical position is NOT comparable across panels — *Mathematics ›
          Other* at 53.85% and *History › Auxiliary historical sciences* at
          16.67% both appear as the top line of their respective panels.
          Use the summary table for absolute comparisons. Each panel is
          capped at 8 sub-subjects to stay within the colorblind-safe Wong
          palette; subjects with more eligible sub-subjects (Technology has
          19, Society 18, People 16) lose the long tail of low-share themes.
          Sub-subjects with fewer than 5 articles are excluded
          (small-denominator noise).

  # ─────────────────────────────────────────────────────────────────────────────
  # Surprises
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Surprises header
        type: text
        col: 12
        content: |
          ## Sub-subjects with surprising AI presence (above or below their parent subject)

          **Description.** Two tables surface sub-subjects whose AI-reference
          share deviates most from their parent subject's mean. The "higher"
          table shows sub-subjects with notably more AI presence than the
          rest of their subject; the "lower" table shows the inverse. Both
          tables exclude sub-subjects with fewer than 5 articles (signal-only)
          and are computed at the latest snapshot.

          **Encoding key.** Columns: subject, sub-subject, sub-subject AI
          share, parent-subject mean share, deviation (sub-subject − subject
          mean) in percentage points, and article-count context.

  - widgets:
      - name: Sub-subjects with HIGHER AI presence than their subject's mean (top 12)
        type: table
        col: 6
        sql: |
          WITH parents AS (
            SELECT subject, share_with_ai AS subject_share
            FROM `bruin-playground-arsalan.report.wat_category_metrics`
            WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.report.wat_category_metrics`)
          )
          SELECT
            s.subject                                                  AS subject,
            s.sub_subject                                              AS sub_subject,
            ROUND(s.share_with_ai * 100, 2)                            AS sub_subject_ai_share_pct,
            ROUND(p.subject_share  * 100, 2)                           AS subject_mean_pct,
            ROUND((s.share_with_ai - p.subject_share) * 100, 2)        AS deviation_pp,
            s.n_articles                                               AS n_articles,
            s.articles_with_ai                                         AS articles_with_ai
          FROM `bruin-playground-arsalan.report.wat_subcategory_metrics` s
          JOIN parents p USING (subject)
          ORDER BY (s.share_with_ai - p.subject_share) DESC
          LIMIT 12
        columns:
          - {name: "subject", label: "Subject"}
          - {name: "sub_subject", label: "Sub-subject"}
          - {name: "sub_subject_ai_share_pct", label: "Sub-subject AI share (%)", format: number}
          - {name: "subject_mean_pct", label: "Subject mean (%)", format: number}
          - {name: "deviation_pp", label: "Deviation (pp)", format: number}
          - {name: "n_articles", label: "N articles", format: number}
          - {name: "articles_with_ai", label: "Articles with AI", format: number}

      - name: Sub-subjects with LOWER AI presence than their subject's mean (bottom 12)
        type: table
        col: 6
        sql: |
          WITH parents AS (
            SELECT subject, share_with_ai AS subject_share
            FROM `bruin-playground-arsalan.report.wat_category_metrics`
            WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.report.wat_category_metrics`)
          )
          SELECT
            s.subject                                                  AS subject,
            s.sub_subject                                              AS sub_subject,
            ROUND(s.share_with_ai * 100, 2)                            AS sub_subject_ai_share_pct,
            ROUND(p.subject_share  * 100, 2)                           AS subject_mean_pct,
            ROUND((s.share_with_ai - p.subject_share) * 100, 2)        AS deviation_pp,
            s.n_articles                                               AS n_articles,
            s.articles_with_ai                                         AS articles_with_ai
          FROM `bruin-playground-arsalan.report.wat_subcategory_metrics` s
          JOIN parents p USING (subject)
          ORDER BY (s.share_with_ai - p.subject_share) ASC
          LIMIT 12
        columns:
          - {name: "subject", label: "Subject"}
          - {name: "sub_subject", label: "Sub-subject"}
          - {name: "sub_subject_ai_share_pct", label: "Sub-subject AI share (%)", format: number}
          - {name: "subject_mean_pct", label: "Subject mean (%)", format: number}
          - {name: "deviation_pp", label: "Deviation (pp)", format: number}
          - {name: "n_articles", label: "N articles", format: number}
          - {name: "articles_with_ai", label: "Articles with AI", format: number}

  - widgets:
      - name: Surprises footnote
        type: text
        col: 12
        content: |
          **Sources.** Sub-subject and subject aggregates from
          `bruin-playground-arsalan.report.wat_subcategory_metrics` and
          `…wat_category_metrics`, both built from snapshots collected via the
          **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**
          over the **[Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          universe.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** "Deviation from parent subject mean" is one of
          many possible surprise metrics; an alternative would be deviation
          from the cross-subject grand median. The choice here favours
          interpretability ("this sub-subject is unusual relative to its own
          siblings") over absolute-rank comparability. Sub-subjects with
          fewer than 5 articles are excluded for the same noise-suppression
          reason as the sub-subject breakdown above.

  # ─────────────────────────────────────────────────────────────────────────────
  # Top growing articles
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Top growing articles header
        type: text
        col: 12
        content: |
          ## Articles with the largest absolute growth in AI references

          **Description.** Per-article view: each row is a Vital-Articles-L4
          article that has at least one AI reference at the latest snapshot,
          ranked by how many additional AI references it has accumulated
          since the earliest snapshot in which it existed. Use this table to
          drill into specific articles that drove the subject-level trends
          shown above.

          **Encoding key.** Columns: article, subject, sub-subject, AI
          references at earliest snapshot, AI references at latest snapshot,
          absolute growth, latest total wikilinks, and the latest AI-link
          share.

  - widgets:
      - name: Top 25 Vital Articles by absolute growth in AI references (earliest → latest snapshot)
        type: table
        col: 12
        sql: |
          SELECT
            article_title                                       AS article,
            subject                                             AS subject,
            sub_subject                                         AS sub_subject,
            earliest_snapshot                                   AS earliest_snapshot,
            COALESCE(earliest_ai_refs, 0)                       AS ai_refs_earliest,
            latest_snapshot                                     AS latest_snapshot,
            latest_ai_refs                                      AS ai_refs_latest,
            ai_refs_added                                       AS growth_refs,
            latest_total_refs                                   AS total_wikilinks_latest,
            ROUND(latest_ai_ref_share * 100, 2)                 AS ai_link_share_pct
          FROM `bruin-playground-arsalan.report.wat_article_growth`
          ORDER BY ai_refs_added DESC
          LIMIT 25
        columns:
          - {name: "article", label: "Article"}
          - {name: "subject", label: "Subject"}
          - {name: "sub_subject", label: "Sub-subject"}
          - {name: "earliest_snapshot", label: "Earliest snapshot"}
          - {name: "ai_refs_earliest", label: "AI refs (earliest)", format: number}
          - {name: "latest_snapshot", label: "Latest snapshot"}
          - {name: "ai_refs_latest", label: "AI refs (latest)", format: number}
          - {name: "growth_refs", label: "Growth (Δ refs)", format: number}
          - {name: "total_wikilinks_latest", label: "Total wikilinks (latest)", format: number}
          - {name: "ai_link_share_pct", label: "AI-link share (%)", format: number}

  - widgets:
      - name: Top growing articles footnote
        type: text
        col: 12
        content: |
          **Sources.** Per-article growth metrics from
          `bruin-playground-arsalan.report.wat_article_growth`. Earliest
          snapshot is the first semiannual snapshot in which the article had
          a usable revision; latest snapshot is the most recent. Raw revision
          content fetched via the
          **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** Articles created after December 2019 use their
          creation snapshot as the baseline, so their "growth" is measured
          over a shorter window than older articles — a recently created
          article with many AI links will rank high even though its growth
          rate over a longer window is unknown. The table excludes articles
          with zero AI references at the latest snapshot.

  # ─────────────────────────────────────────────────────────────────────────────
  # Methodology
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          ## Methodology, data vintages, and limitations

          **Universe.** **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          — ~9,907 articles editorially curated as the most important topics
          across all of human knowledge, organized into 11 top-level subjects
          (People, History, Geography, Arts, Philosophy and religion,
          Everyday life, Society and social sciences, Biology and health
          sciences, Physical sciences, Technology, Mathematics) and ~120
          sub-subjects. Each article is tagged with its subject and
          sub-subject directly from the Vital Articles list structure.

          **AI seed list.** ~47 curated AI-topic articles spanning
          foundations (Artificial intelligence, Machine learning, Neural
          network, Deep learning), architectures (Transformer, Recurrent
          neural network, Convolutional neural network), modern systems
          (Large language model, GPT-4, ChatGPT, BERT, Claude, Gemini),
          companies (OpenAI, Anthropic, DeepMind), sub-fields (Natural
          language processing, Computer vision, Reinforcement learning), and
          cultural/policy topics (AI safety, AI ethics, AI alignment). Each
          canonical title is expanded to include its current redirect
          aliases (fetched via the MediaWiki API), so that historical
          revisions linking via an older redirect spelling are still counted.

          **Snapshots.** 14 semiannual snapshots at fixed calendar dates:
          December 1 and May 1, starting Dec-2019 through May-2026. For each
          (article × date), the **[MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**
          returns the closest revision at or before the target date (small
          temporal drift expected, generally <1 day). The full revision
          content is parsed for `[[wikilink]]` syntax; every distinct
          wikilink target is counted, and intersections with the AI alias
          list are tallied as "AI references".

          **Pipeline.** `raw.wat_vital_articles` and `raw.wat_ai_seed_articles`
          are one-shot scrapes; `raw.wat_article_snapshots` is the
          long-running ingestion job. The `staging.wat_*` layer dedupes,
          normalizes, and joins. The `report.wat_*` layer aggregates to
          subject/sub-subject/article level. All assets run via **Bruin cli**
          on **BigQuery**; this dashboard renders from those tables via
          **Bruin dac**.

          **General limitations.**
          (a) "AI reference" is a structural wikilink to one of 47 curated
          AI-topic articles — it is a proxy for editorial association, not
          for sentiment, prominence, or semantic meaning. An article that
          mentions AI in body text without linking will not be counted.
          (b) The universe is curated (Vital Articles L4); the results do not
          generalize to the ~6.8M-article English Wikipedia at large.
          (c) Some AI seed articles did not exist in 2019 (e.g. *GPT-4* page
          was created in 2023); apparent growth partly reflects new AI
          concepts entering Wikipedia, not only outside articles adopting
          them.
          (d) English Wikipedia only.
          (e) Snapshot cadence is ~6 months — short-term spikes between
          snapshots are not visible.
          (f) The AI seed list is curated and finite; topics outside it
          (e.g. *Symbolic AI*, *Expert system*) are not counted unless
          explicitly added to the seed.
