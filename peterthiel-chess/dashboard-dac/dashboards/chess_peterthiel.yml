        col: 12
        content: |
          **Sources:** **[Chess.com Published Data API](https://www.chess.com/news/view/published-data-api)** public game end times, ratings, and results for the **peterthiel** account.

          **Tools:** **Bruin cli** (session transformation and reporting), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** A session begins after more than 30 minutes between recorded game-end times and includes only 3+0 sessions with at least ten games. A gap threshold cannot prove that someone was continuously playing, and later games in a session are not independent observations. The fixed 45–60% line-chart range is disclosed to make the comparison legible.

  - tab: Hidden insights
    widgets:
      - name: Repeat-opponent surprises header
        type: text
        col: 12
        content: |
          # Repeat public matchups with the largest shortfall versus the rating proxy

          **The opponent named tututante is the clearest long-running example: the account scored 16.7% (2 wins, 10 losses) in 12 games on 12 UTC dates from 2018–2025, despite a 53.6% average expected-score proxy. The table limits itself to repeat pairings with at least eight games and a 35%+ expected score, so it avoids merely listing mismatches against far stronger opponents.**

          **Columns:** actual and expected values are percentages of possible points; residual is actual minus expected in percentage points. **Ordering:** most negative residual first.
  - tab: Hidden insights
    widgets:
      - name: Repeat-opponent surprises table
        type: table
        col: 12
        sql: |
          SELECT
            matchup_rank,
            opponent_username,
            games,
            wins,
            draws,
            losses,
            actual_score_pct,
            expected_score_proxy_pct,
            performance_residual_proxy_pp,
