# Generated by scripts/build_dashboard.py - edit the script, not this file.
name: Germany by State - Economy and Society 2025
description: Choropleth maps of 16 economic and social indicators for the 16 German states, one reference year.
connection: bruin-playground-arsalan
rows:
- tab: Overview
  widgets:
  - name: overview_intro
    type: text
    col: 12
    content: |
      # Germany's 16 states compared: economy and society, 2025

      **All maps compare the 16 states (Bundesländer) in the same reference year: 2025, the latest year with official values for every state across all indicators. The one exception, disposable income, is published only up to 2024 and has its own tab. Fifteen indicators come from Destatis, the regional accounts of the states (VGRdL), and Eurostat.**

      The **Economy** and **Society** tabs show one map per indicator next to a ranked bar chart of the same values. **Data quality & methodology** lists the reference period, completeness, and source of every indicator. State abbreviations: BW Baden-Württemberg, BY Bayern, BE Berlin, BB Brandenburg, HB Bremen, HH Hamburg, HE Hessen, MV Mecklenburg-Vorpommern, NI Niedersachsen, NW Nordrhein-Westfalen, RP Rheinland-Pfalz, SL Saarland, SN Sachsen, ST Sachsen-Anhalt, SH Schleswig-Holstein, TH Thüringen.
- tab: Overview
  widgets:
  - name: Population, 31 Dec 2025 (million)
    type: metric
    col: 3
    sql: |
      SELECT value / 1e6 AS value FROM `bruin-playground-arsalan.staging.de_state_indicators`
      WHERE region_code = 'DG' AND indicator_id = 'population' AND year = 2025
    value:
      field: value
      type: number
      format: ',.2f'
  - name: GDP per inhabitant, 2025 (EUR)
    type: metric
    col: 3
    sql: |
      SELECT value AS value FROM `bruin-playground-arsalan.staging.de_state_indicators`
      WHERE region_code = 'DG' AND indicator_id = 'gdp_per_capita' AND year = 2025
    value:
      field: value
      type: number
      format: ',.0f'
  - name: Registered unemployment rate, 2025 (%)
    type: metric
    col: 3
    sql: |
      SELECT value AS value FROM `bruin-playground-arsalan.staging.de_state_indicators`
      WHERE region_code = 'DG' AND indicator_id = 'unemployment_rate' AND year = 2025
    value:
      field: value
      type: number
      format: .1f
  - name: Total fertility rate, 2025 (children per woman)
    type: metric
    col: 3
    sql: |
      SELECT value AS value FROM `bruin-playground-arsalan.staging.de_state_indicators`
      WHERE region_code = 'DG' AND indicator_id = 'total_fertility_rate' AND year = 2025
    value:
      field: value
      type: number
      format: .2f
- tab: Overview
  widgets:
  - name: east_west_header
    type: text
    col: 12
    content: |
      # East-West comparison of state averages, by indicator, 2025

      **Eastern states average EUR 40,000 GDP per inhabitant against EUR 56,600 in the west, but unemployment, employment and poverty rates differ by less than one percentage point.**

      **Columns:** unweighted means of state values; East vs West = gap as % of the western mean.
- tab: Overview
  widgets:
  - name: East-West comparison table
    type: table
    col: 12
    sql: |
      WITH g AS (
        SELECT s.indicator_id, s.short_label, s.unit_label, s.reference_period, c.display_order, c.label_decimals,
          AVG(IF(s.region_group = 'West', s.value, NULL)) AS west_mean,
          AVG(IF(s.region_group = 'East', s.value, NULL)) AS east_mean,
          MAX(IF(s.region_group = 'Berlin', s.value, NULL)) AS berlin,
          MAX(s.germany_value) AS germany
        FROM `bruin-playground-arsalan.report.de_state_indicator_snapshot` AS s
        JOIN `bruin-playground-arsalan.staging.de_indicator_catalog` AS c USING (indicator_id)
        GROUP BY 1, 2, 3, 4, 5, 6
      )
      SELECT short_label AS indicator, unit_label AS unit, reference_period,
        FORMAT('%\'.*f', dec, west_mean) AS west_mean,
        FORMAT('%\'.*f', dec, east_mean) AS east_mean,
        FORMAT('%\'.*f', dec, berlin) AS berlin,
        FORMAT('%\'.*f', dec, germany) AS germany,
        ROUND(100 * (east_mean - west_mean) / west_mean, 1) AS east_vs_west_pct
      FROM (SELECT *, IF(unit_label = '%', GREATEST(label_decimals, 1), label_decimals) AS dec FROM g)
      ORDER BY display_order
    columns:
    - name: indicator
      label: Indicator
    - name: unit
      label: Unit
    - name: reference_period
      label: Reference period
    - name: west_mean
      label: West, mean of 10 states
      align: right
    - name: east_mean
      label: East, mean of 5 states
      align: right
    - name: berlin
      label: Berlin
      align: right
    - name: germany
      label: Germany
      align: right
    - name: east_vs_west_pct
      label: East vs West (%)
      number: +.1f
      format:
      - backgroundColor:
        - '#0072B2'
        - '#f7f7f7'
        - '#E69F00'
        range:
        - -75
        - 0
        - 75
        unit: absolute
- tab: Overview
  widgets:
  - name: east_west_footnote
    type: text
    col: 12
    content: |
      **Sources:** Destatis GENESIS-Online, Arbeitskreis VGR der Länder, and Eurostat (see each map's footnote for the table), licence dl-de/by-2-0 / licence CC BY 4.0.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Unweighted means give Bremen the same weight as Nordrhein-Westfalen; population-weighted averages would move the western means toward the large states. West = ten western states without Berlin; East = Brandenburg, Mecklenburg-Vorpommern, Sachsen, Sachsen-Anhalt, Thüringen. Disposable income refers to 2024.
- tab: Overview
  widgets:
  - name: overview_divider
    type: divider
    col: 12
- tab: Overview
  widgets:
  - name: correlation_header
    type: text
    col: 12
    content: |
      # Correlation between indicators across the 16 states, 2025 (Pearson r)

      **The share aged 65+ moves against hourly earnings (r = -0.95); GDP per inhabitant tracks earnings (r = 0.91) and land prices (r = 0.88).**

      **Cells:** orange = positive, blue = negative, white = none; printed value = r.
- tab: Overview
  height: 700
  widgets:
  - name: Correlation matrix - 15 indicators, 16 states, 2025 (Pearson r)
    type: chart
    chart: vega-lite
    col: 12
    sql: |
      SELECT label_x, label_y, order_x, order_y, pearson_r, r_label, n_states
      FROM `bruin-playground-arsalan.report.de_indicator_correlations`
      ORDER BY order_x, order_y
    spec:
      layer:
      - mark:
          type: rect
          stroke: '#0b0e14'
          strokeWidth: 1
        encoding:
          x:
            field: label_x
            type: nominal
            sort:
              field: order_x
            title: null
            axis:
              labelAngle: -40
              labelLimit: 170
              orient: bottom
          y:
            field: label_y
            type: nominal
            sort:
              field: order_y
            title: null
            axis:
              labelLimit: 170
          fill:
            field: pearson_r
            type: quantitative
            scale:
              scheme: blueorange
              domain:
              - -1
              - 1
            legend:
              title: Pearson r
              format: .1f
              gradientLength: 260
          tooltip:
          - field: label_y
            title: Indicator
          - field: label_x
            title: Compared with
          - field: r_label
            title: Pearson r
          - field: n_states
            title: States
      - mark:
          type: text
          fontSize: 9.5
        encoding:
          x:
            field: label_x
            type: nominal
            sort:
              field: order_x
          y:
            field: label_y
            type: nominal
            sort:
              field: order_y
          text:
            field: r_label
          color:
            condition:
              test: abs(datum.pearson_r) > 0.6
              value: '#ffffff'
            value: '#111111'
- tab: Overview
  widgets:
  - name: correlation_footnote
    type: text
    col: 12
    content: |
      **Sources:** the 2025 indicators shown in the Economy and Society tabs (Destatis GENESIS-Online, Arbeitskreis VGR der Länder, Eurostat), licence dl-de/by-2-0 / licence CC BY 4.0.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** n = 16 states, so |r| below about 0.5 is not distinguishable from zero at the 5% level. Correlations describe states, not individuals, and do not imply causation; much of the pattern reflects the east-west divide and the three city-states. Disposable income (2024) is excluded so that every pair uses the same reference year.
- tab: Economy
  widgets:
  - name: gdp_per_capita_header
    type: text
    col: 12
    content: |
      # GDP per inhabitant by state, 2025 (EUR, current prices)

      **Hamburg (EUR 90,208) is 2.3 times Sachsen-Anhalt (EUR 38,452); all five eastern states rank below every western state.**

      **Map:** white = lowest, dark blue = highest. **Bars:** sorted highest to lowest; dashed line = Germany.
