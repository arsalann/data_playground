name: raw.shopify_customers_test
type: ingestr
connection: bruin-playground-arsalan
description: |
  Connection-test asset that ingests Shopify customers into BigQuery with
  Bruin's built-in ingestr runner. This table is intentionally suffixed `_test`
  and is not consumed by the demo staging, report, or dashboard assets.

parameters:
  source_connection: bruin-shop-shopify-test
  source_table: customers
  destination: bigquery
  incremental_strategy: merge
  incremental_key: updated_at

columns:
  - name: id
    type: VARCHAR
    primary_key: true
    description: Shopify customer identifier.
  - name: updated_at
    type: TIMESTAMP
    description: Timestamp when the Shopify customer was last updated.
  - name: created_at
    type: TIMESTAMP
    description: Timestamp when the Shopify customer was created.
  - name: email
    type: VARCHAR
    description: Shopify customer email address, if present.
