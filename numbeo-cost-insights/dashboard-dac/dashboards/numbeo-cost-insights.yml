name: The Cost-of-Living Squeeze
description: |
  A current global comparison of prices, rent, and local purchasing power,
  designed to surface places where "cheap" still does not mean affordable.
connection: bruin-playground-arsalan

rows:
  - tab: Global
    widgets:
      - name: Cities tracked
        type: metric
        col: 3
        value: { field: value, type: number, format: ",.0f" }
        sql: |
          SELECT COUNT(*) AS value
          FROM `bruin-playground-arsalan.numbeo_staging.city_cost_metrics`
          WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.numbeo_staging.city_cost_metrics`)
      - name: Countries tracked
        type: metric
        col: 3
        value: { field: value, type: number, format: ",.0f" }
        sql: |
          SELECT COUNT(*) AS value
          FROM `bruin-playground-arsalan.numbeo_staging.country_cost_metrics`
          WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.numbeo_staging.country_cost_metrics`)
      - name: Cities in a squeeze
        type: metric
        col: 3
        value: { field: value, type: number, format: ",.0f" }
        sql: |
          SELECT COUNT(*) AS value
          FROM `bruin-playground-arsalan.numbeo_staging.city_cost_metrics`
          WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.numbeo_staging.city_cost_metrics`)
            AND affordability_gap_index > 0
      - name: Largest country gap
        type: metric
        col: 3
        value: { field: value, type: number, format: ",.1f" }
        sql: |
          SELECT MAX(affordability_gap_index) AS value
          FROM `bruin-playground-arsalan.numbeo_staging.country_cost_metrics`
          WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.numbeo_staging.country_cost_metrics`)

  - tab: Global
    widgets:
      - name: The cost-of-living squeeze overview
        type: text
        col: 12
        content: |
          # When "cheap" still means unaffordable

          **Numbeo's current city and country indices reveal a counter-intuitive split: the places with the lowest sticker prices are not always the places where local pay stretches furthest. The dashboard defines an affordability gap as combined cost plus rent minus local purchasing power. A positive gap means indexed living costs outrun indexed local buying power.**

          **Reading guide:** Indexes use New York City = 100. Higher gap = tighter local affordability. The source is a live, user-contributed benchmark, so treat rankings as directional rather than as official household budgets.

  - tab: Global
    widgets:
      - name: Country affordability gap header
        type: text
        col: 12
        content: |
          # Countries where the price tag outruns local buying power

          **The largest country-level gap is 52.5 index points in the Solomon Islands; Turkmenistan follows at 47.6 and Cuba at 25.6. This is the dashboard's sharpest warning against equating a low cost-of-living index with an easy local life: these places have low indexed prices, but local purchasing power is lower still.**

          **Encoding key:** Bars = affordability gap (index points; combined cost plus rent minus local purchasing power). **Line:** zero gap, the break-even threshold. **X-axis:** country or territory.

  - tab: Global
    widgets:
      - name: Country affordability gap chart
        type: chart
        chart: combo
        col: 12
        sql: |
          SELECT
            country,
            affordability_gap_index,
            0.0 AS zero_gap
          FROM `bruin-playground-arsalan.numbeo_report.country_squeeze_top`
          ORDER BY affordability_gap_index DESC
        x: { field: country, type: category, title: "Country or territory" }
        y: { field: [affordability_gap_index, zero_gap], type: number, format: ".1f", title: "Index points" }
        lines: [zero_gap]

  - tab: Global
    widgets:
      - name: Country affordability gap footnote
        type: text
        col: 12
        content: |
          **Sources:** **[Numbeo current country rankings](https://www.numbeo.com/cost-of-living/rankings_by_country.jsp)** (crowdsourced cost, rent, and purchasing-power indices; New York City = 100).

          **Tools:** **Bruin cli** (ingestion and transformations), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** This is a relative index subtraction, not a household budget or a claim about disposable income. Country coverage and contributor density vary. Territories and small markets can have thin samples; currency conversion, household size, taxes, and public benefits are not modeled.

  - tab: Global
    widgets:
      - name: Country affordability gap table
        type: table
        col: 12
        sql: |
          SELECT
            country,
            affordability_gap_index,
            cost_of_living_plus_rent_index,
            local_purchasing_power_index,
            rent_to_purchasing_power_ratio
          FROM `bruin-playground-arsalan.numbeo_report.country_squeeze_top`
          ORDER BY affordability_gap_index DESC
        columns:
          - name: country
            label: Country / territory
          - name: affordability_gap_index
            label: Gap (index pts)
            format: number
          - name: cost_of_living_plus_rent_index
            label: Cost + rent
            format: number
          - name: local_purchasing_power_index
            label: Local buying power
            format: number
          - name: rent_to_purchasing_power_ratio
            label: Rent / buying power
            format: number

  - tab: Global
    widgets:
      - name: City affordability comparison header
        type: text
        col: 12
        content: |
          # Cities where combined costs beat local buying power

          **The city-level outliers are even more visceral: Abidjan's combined cost-plus-rent index is 20.0 points above its local purchasing-power index, followed by Addis Ababa at 18.7 and Bali at 17.9. These are not the world's most expensive cities; they are places where low absolute prices coexist with even lower local buying power.**

          **Encoding key:** Bars = combined cost plus rent and local purchasing power (both indexed to New York City = 100). **X-axis:** city; country is shown in the companion table.

  - tab: Global
    widgets:
      - name: City affordability comparison chart
        type: chart
        chart: combo
        col: 12
        sql: |
          SELECT
            city,
            cost_of_living_plus_rent_index AS cost_plus_rent,
            local_purchasing_power_index AS local_buying_power
          FROM `bruin-playground-arsalan.numbeo_report.city_squeeze_top`
          ORDER BY affordability_gap_index DESC
        x: { field: city, type: category, title: "City" }
        y: { field: [cost_plus_rent, local_buying_power], type: number, format: ".1f", title: "Index (New York City = 100)" }

  - tab: Global
    widgets:
      - name: City affordability comparison footnote
        type: text
        col: 12
        content: |
          **Sources:** **[Numbeo current city rankings](https://www.numbeo.com/cost-of-living/rankings_current.jsp)** (crowdsourced city cost, rent, and purchasing-power indices; New York City = 100).

          **Tools:** **Bruin cli** (ingestion and transformations), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** The chart intentionally focuses on positive-gap cities only. Numbeo city labels can combine city and territory names inconsistently, and local purchasing power is an index proxy rather than observed household income after tax. Bars use a zero baseline as required for truthful comparison.

  - tab: Global
    widgets:
      - name: City affordability comparison table
        type: table
        col: 12
        sql: |
          SELECT
            city,
            country,
            affordability_gap_index,
