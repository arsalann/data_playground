          FROM `bruin-playground-arsalan.numbeo_report.city_squeeze_top`
          ORDER BY affordability_gap_index DESC
        columns:
          - name: city
            label: City
          - name: country
            label: Country / territory
          - name: affordability_gap_index
            label: Gap (index pts)
            format: number
          - name: cost_of_living_plus_rent_index
            label: Cost + rent
            format: number
          - name: local_purchasing_power_index
            label: Local buying power
            format: number
          - name: rent_to_purchasing_power_ratio
            label: Rent / buying power
            format: number

  - tab: Global
    widgets:
      - name: Rent burden header
        type: text
        col: 12
        content: |
          # Rent can be more than twice local buying power

          **Lagos is the dashboard's most extreme city-level rent burden: its indexed rent is 2.83× its local purchasing-power index. Bali follows at 2.05×. This ratio is a relative stress signal, not a claim that rent literally consumes that share of salary, but it makes the housing squeeze legible across currencies.**

          **Encoding key:** Bars = rent index divided by local purchasing-power index (×). **Line:** 1.00× parity, where the two indexes are equal. **X-axis:** city.

  - tab: Global
    widgets:
      - name: Rent burden chart
        type: chart
        chart: combo
        col: 12
        sql: |
          SELECT
            city,
            rent_to_purchasing_power_ratio AS rent_burden_ratio,
            1.0 AS parity_ratio
          FROM `bruin-playground-arsalan.numbeo_report.city_rent_burden_top`
          ORDER BY rent_to_purchasing_power_ratio DESC
        x: { field: city, type: category, title: "City" }
        y: { field: [rent_burden_ratio, parity_ratio], type: number, format: ".2f", title: "Indexed ratio (×)" }
        lines: [parity_ratio]

  - tab: Global
    widgets:
      - name: Rent burden footnote
        type: text
        col: 12
        content: |
          **Sources:** **[Numbeo current city rankings](https://www.numbeo.com/cost-of-living/rankings_current.jsp)** (rent and local purchasing-power indices; New York City = 100).

          **Tools:** **Bruin cli** (ingestion and transformations), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** A ratio of indexes is not a rent-to-income percentage: Numbeo's purchasing-power index incorporates local prices and salary assumptions, while the rent index is city-level. Small-sample cities and informal housing markets may be underrepresented.

  - tab: Africa
    widgets:
      - name: Africa affordability story header
        type: text
        col: 12
        content: |
          # Africa: the local affordability squeeze

          **This tab ranks the ten cities with the widest affordability gaps in Africa. Use it to compare where combined cost plus rent is furthest above local purchasing power, regardless of the absolute price level.**

          **Encoding key:** Bars = affordability gap (index points; combined cost plus rent minus local purchasing power). **Line:** zero gap, the break-even threshold. **X-axis:** city.
  - tab: Africa
    widgets:
      - name: Africa city affordability gap
        type: chart
        chart: combo
        col: 12
        sql: |
          SELECT
            city,
            affordability_gap_index,
            0.0 AS zero_gap
          FROM `bruin-playground-arsalan.numbeo_staging.city_cost_metrics`
          WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.numbeo_staging.city_cost_metrics`)
            AND continent = 'Africa'
          ORDER BY affordability_gap_index DESC
          LIMIT 10
        x: { field: city, type: category, title: "City" }
        y: { field: [affordability_gap_index, zero_gap], type: number, format: ".1f", title: "Index points" }
        lines: [zero_gap]
  - tab: Africa
    widgets:
      - name: Africa affordability story footnote
