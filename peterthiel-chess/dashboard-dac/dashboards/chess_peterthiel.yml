  - tab: Hidden insights
    widgets:
      - name: Rating-shock header
        type: text
        col: 12
        content: |
          # Largest rating-proxy surprise wins and losses in public 3+0 games

          **The largest selected underdog win was against vicoy25 on 2022-09-02: a 2,062 player-rating proxy versus a 2,487 opponent snapshot (a 425-point gap) implied an 8.0% expected score, yet the account won after 66 recorded moves. “Favored losses” are equally strong rating surprises, but neither result type identifies a move-level blunder without engine analysis.**

          **Columns:** rating gap is player proxy minus opponent snapshot; a negative gap marks an underdog result. **Selection:** both recorded ratings must be at least 1,800; each result type is ranked by the largest absolute rating gap.
  - tab: Hidden insights
    widgets:
      - name: Rating-shock games table
        type: table
        col: 12
        sql: |
          SELECT
            notable_kind,
            notable_rank,
            game_date_utc,
            opponent_username,
            player_rating_before,
            opponent_rating_after,
            rating_gap_proxy,
            expected_score_proxy_pct,
            player_move_count,
            opening_name
          FROM `bruin-playground-arsalan.chess_peterthiel.report_notable_games`
          WHERE notable_kind IN ('Underdog win', 'Favored loss')
            AND notable_rank <= 5
          ORDER BY
            CASE notable_kind
              WHEN 'Underdog win' THEN 1
              WHEN 'Favored loss' THEN 2
              ELSE 3
            END,
            notable_rank
        columns:
          - { name: notable_kind, label: Result selection }
          - { name: notable_rank, label: Rank, number: ",.0f" }
          - { name: game_date_utc, label: UTC date }
          - { name: opponent_username, label: Opponent }
          - { name: player_rating_before, label: Player rating proxy, number: ",.0f" }
          - { name: opponent_rating_after, label: Opponent rating snapshot, number: ",.0f" }
          - { name: rating_gap_proxy, label: Rating gap proxy, number: ",.0f" }
          - { name: expected_score_proxy_pct, label: Expected score proxy (%), number: ",.1f" }
          - { name: player_move_count, label: Recorded player moves, number: ",.0f" }
          - { name: opening_name, label: Chess.com opening label }
  - tab: Hidden insights
    widgets:
      - name: Rating-shock footnote
        type: text
        col: 12
        content: |
          **Sources:** **[Chess.com Published Data API](https://www.chess.com/news/view/published-data-api)** public ratings, results, PGN moves, and opening labels for the **peterthiel** account.

          **Tools:** **Bruin cli** (PGN parsing and reporting), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Selection is driven by a rating proxy, not a chess-engine evaluation. Both rating fields are public snapshots after games except that the target’s prior value is reconstructed from the preceding game in the same time control. A result far from a rating expectation is not evidence of a blunder, cheating, or causal explanation.

  - tab: Hidden insights
    widgets:
      - name: Result-streak header
        type: text
        col: 12
        content: |
          # The longest uninterrupted public winning and losing runs in 3+0

          **The longest winning run is 16 games over 30.0 hours, with a +116-point rating change proxy; the longest losing run is 14 games over 25.3 hours, with a −117-point change. The near symmetry is a compact view of result volatility—not a measure of momentum or psychology.**

          **Columns:** a draw breaks a run; duration is measured between first and final recorded game-end timestamps. **Ordering:** longest result run first within wins and losses.
  - tab: Hidden insights
    widgets:
      - name: Result-streak table
        type: table
        col: 12
        sql: |
          SELECT
            CASE streak_kind
              WHEN 'win' THEN 'Winning run'
              WHEN 'loss' THEN 'Losing run'
              ELSE streak_kind
            END AS result_run,
            streak_rank,
            consecutive_games,
            streak_start_utc,
            streak_end_utc,
            streak_duration_hours,
            player_rating_before_start,
            player_rating_after_end,
            rating_change_proxy
          FROM `bruin-playground-arsalan.chess_peterthiel.report_result_streaks`
          ORDER BY result_run, streak_rank
        columns:
          - { name: result_run, label: Result run }
          - { name: streak_rank, label: Rank, number: ",.0f" }
          - { name: consecutive_games, label: Consecutive games, number: ",.0f" }
          - { name: streak_start_utc, label: Start (UTC) }
          - { name: streak_end_utc, label: End (UTC) }
          - { name: streak_duration_hours, label: Duration (hours), number: ",.1f" }
          - { name: player_rating_before_start, label: Start rating proxy, number: ",.0f" }
          - { name: player_rating_after_end, label: End rating snapshot, number: ",.0f" }
          - { name: rating_change_proxy, label: Rating change proxy, number: ",.0f" }
  - tab: Hidden insights
    widgets:
      - name: Result-streak footnote
        type: text
        col: 12
        content: |
          **Sources:** **[Chess.com Published Data API](https://www.chess.com/news/view/published-data-api)** public timestamps, results, and ratings for the **peterthiel** account.

          **Tools:** **Bruin cli** (reporting), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** A public timestamp sequence does not reveal why a run occurred. A draw breaks a run by definition, and the rating change uses the same reconstructed/pre-game and post-game snapshot convention as the rest of the project.

  - tab: Hidden insights
    widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          # Methodology

          Bruin ingests the public **peterthiel** Chess.com archive through the Chess ingestr source, deduplicates public game URLs, and analyzes the account from its recorded side of each game. The accessible archive begins in December 2016 and covers roughly 9.6 years, not a verified full decade. All timing is UTC; no local-time or personal-identity inference is made.

          The dominant 3+0 time control is selected by archive frequency. The rating proxy uses the target account’s prior public game-end rating in that time control as a pre-game approximation and the opponent's public post-game rating. Session analysis uses a 30-minute gap between game-end timestamps, restricts to sessions of at least ten 3+0 games, and reports associations only. Repeat-opponent rows require at least eight games and an average expected score of at least 35%.

          Titled opponents are matched case-insensitively to the current public Chess.com GM/IM/FM/NM/WGM/WIM/WFM/WNM registries fetched on pipeline execution. This is a current username-level match, not a claim about historical title status or real-world identity. PGN-derived move counts are descriptive. No engine analysis or claim about blunders, strategy quality, intent, fatigue, or causation is made.
