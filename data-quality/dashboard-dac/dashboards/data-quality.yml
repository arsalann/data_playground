connection: bruin-playground-arsalan
description: Data Quality — Source Metric Comparison (DUMMY DATA). Semantic metrics over the same deterministic
  user/day fixture; inclusive date filters.
filters:
- default: '2026-09-06'
  name: start_date
  type: date
- default: '2026-10-05'
  name: end_date
  type: date
name: Data Quality
rows:
- tab: Overview
  widgets:
  - col: 12
    columns:
    - frozen: true
      label: Metric
      name: metric
    - label: Unit
      name: unit
    - align: right
      label: Firebase
      name: firebase
      number: ',.2f'
    - align: right
      label: Adjust
      name: adjust
      number: ',.2f'
    - align: right
      label: AppLovin
      name: applovin
      number: ',.2f'
    - align: right
      format:
      - if: is_empty
        textColor: '#999999'
      - bold: true
        if: is_not_between
        textColor: '#D55E00'
        value:
        - -0.05
        - 0.05
      - textColor: '#0072B2'
      label: Firebase vs Adjust (%)
      name: firebase_vs_adjust_diff_pct
      number: +.1%
    - align: right
      format:
      - if: is_empty
        textColor: '#999999'
      - bold: true
        if: is_not_between
        textColor: '#D55E00'
        value:
        - -0.05
        - 0.05
      - textColor: '#0072B2'
      label: AppLovin vs Adjust (%)
      name: applovin_vs_adjust_diff_pct
      number: +.1%
    id: t_overview_summary
    name: Overview Summary
    type: table
    filters:
    - dimension: dt
      operator: between
      value:
        start: '{{ filters.start_date }}'
        end: '{{ filters.end_date }}'
    model: data_quality_comparisons
    dimensions:
    - name: metric
    - name: unit
    metrics:
    - firebase
    - adjust
    - applovin
    - firebase_vs_adjust_diff_pct
    - applovin_vs_adjust_diff_pct
    segments:
    - overview
- tab: Overview
  widgets:
  - id: c_presence_user_days_header
    name: Users by Source Presence context
    type: text
    col: 12
    content: '# Users by Source Presence


      **Users are counted once within the selected interval. Source membership is fixed in this fixture.**


      **Encoding:** X = Source presence; Y = Users. users: #0072B2, solid.'
- tab: Overview
  height: 420px
  widgets:
  - chart: bar
    col: 12
    horizontal: true
    id: c_presence_user_days
    name: Users by Source Presence
    series:
      users:
        color: '#0072B2'
    type: chart
    x:
      field: presence_bucket
      title: Source presence
      type: category
    y:
      beginAtZero: true
      curve: straight
      field:
      - users
      format: ',.0f'
      markers: false
      title: Users
      type: number
    filters:
    - dimension: dt
      operator: between
      value:
        start: '{{ filters.start_date }}'
        end: '{{ filters.end_date }}'
    dimensions:
    - name: presence_bucket
    metrics:
    - users
    segments:
    - attributed
    sort:
    - name: users
      direction: desc
    - name: presence_bucket
      direction: asc
- tab: Overview
  widgets:
  - id: c_presence_user_days_footnote
    name: Users by Source Presence sources
    type: text
    col: 12
    content: '**Sources:** **[Data Quality synthetic fixture](https://github.com/arsalann/data_playground/tree/main/data-quality)**,
      reproduced from dashboard 1135; no external data or source license applies.


      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).


      **Limitations:** DUMMY DATA, not production Firebase/Adjust/AppLovin. Fixed September 6–October 5, 2026 fixture;
      outside dates return no observations. Unattributed AppLovin revenue is included in totals, excluded from user
      counts.'
- tab: Overview
  widgets:
  - id: c_daily_source_users_header
    name: Daily Users by Source context
    type: text
    col: 12
    content: '# Daily Users by Source


      **Daily distinct users are calculated independently; period totals count each user once.**


      **Encoding:** X = Date; Y = Users. aj_users: #E69F00, dashed; al_users: #009E73, dotted; fb_users: #0072B2,
      solid.'
- tab: Overview
  height: 420px
  widgets:
  - chart: line
    col: 12
    id: c_daily_source_users
    name: Daily Users by Source
    series:
      aj_users:
        color: '#E69F00'
        curve: straight
        dash: dashed
      al_users:
        color: '#009E73'
        curve: straight
        dash: dotted
      fb_users:
        color: '#0072B2'
        curve: straight
    type: chart
    x:
      field: dt
      format: '%b %d'
      title: Date
      type: date
    y:
      beginAtZero: false
      curve: straight
      field:
      - fb_users
      - aj_users
      - al_users
      format: ',.0f'
      markers: false
      title: Users
      type: number
    filters:
    - dimension: dt
      operator: between
      value:
        start: '{{ filters.start_date }}'
        end: '{{ filters.end_date }}'
    dimensions:
    - name: dt
    metrics:
    - fb_users
    - aj_users
    - al_users
    sort:
    - name: dt
      direction: asc
- tab: Overview
  widgets:
  - id: c_daily_source_users_footnote
    name: Daily Users by Source sources
    type: text
    col: 12
    content: '**Sources:** **[Data Quality synthetic fixture](https://github.com/arsalann/data_playground/tree/main/data-quality)**,
