name: "Argentina–Spain 2026 World Cup Final: Overview"
description: The completed tournament record from FIFA match reports, official squads, and the full senior-men's head-to-head series.
connection: bruin-playground-arsalan

filters:
  - name: team
    type: select
    default: Argentina
    options:
      values: [Argentina, Spain]

rows:
  - widgets:
      - name: overview_intro
        type: text
        col: 12
        content: |
          # Argentina–Spain World Cup final: the completed record

          **Spain won the final 1–0. This is the complete eight-report tournament record for both teams, the current 26-player squad lists, and all 15 senior men's meetings.** It is context for what happened, not a shortcut to an opponent-adjusted rating.

          **Encoding:** Argentina is the first series; Spain is the second. Legends, bar positions, labels, and tooltips identify each series as well as colour.

  - widgets:
      - name: Argentina average xG differential (xG per match)
        type: metric
        col: 3
        sql: |
          SELECT xg_differential_per_match AS value
          FROM `bruin-playground-arsalan.final_reports.team_kpis`
          WHERE team_name = 'Argentina'
        value: { field: value, type: number, format: "+.2f" }
        description: FIFA xG created minus FIFA xG conceded, per completed tournament match.
      - name: Spain average xG differential (xG per match)
        type: metric
        col: 3
        sql: |
          SELECT xg_differential_per_match AS value
          FROM `bruin-playground-arsalan.final_reports.team_kpis`
          WHERE team_name = 'Spain'
        value: { field: value, type: number, format: "+.2f" }
        description: FIFA xG created minus FIFA xG conceded, per completed tournament match.
      - name: Argentina goals per tournament match
        type: metric
        col: 3
        sql: |
          SELECT goals_per_match AS value
          FROM `bruin-playground-arsalan.final_reports.team_kpis`
          WHERE team_name = 'Argentina'
        value: { field: value, type: number, format: ".2f" }
        description: Goals scored per completed tournament match.
      - name: Spain goals per tournament match
        type: metric
        col: 3
        sql: |
          SELECT goals_per_match AS value
          FROM `bruin-playground-arsalan.final_reports.team_kpis`
          WHERE team_name = 'Spain'
        value: { field: value, type: number, format: ".2f" }
        description: Goals scored per completed tournament match.

  - widgets:
      - name: xg_differential_header
        type: text
        col: 12
        content: |
          # xG differential by tournament match, Argentina and Spain

          **Spain finished at +1.87 xG per match; Argentina finished at +1.09. The final accounts for the swing: Spain posted +2.45 xG and Argentina −2.45.** Eight matches are a fuller record, but still not an opponent-adjusted rating.

          **Encoding:** x-axis = each team's chronological tournament match number. y-axis = FIFA xG created minus xG conceded. Blue line = Argentina; vermillion line = Spain.
  - widgets:
      - name: xG differential by tournament match
        type: chart
        chart: combo
        col: 12
        lines: [argentina, spain]
        sql: |
          SELECT
            match_number,
            MAX(IF(team_name = 'Argentina', xg_differential, NULL)) AS argentina,
            MAX(IF(team_name = 'Spain', xg_differential, NULL)) AS spain
          FROM `bruin-playground-arsalan.final_reports.xg_trends`
          GROUP BY match_number
          ORDER BY match_number
        x: { field: match_number, type: number }
        y: { field: [argentina, spain], type: number, format: "+.2f" }
  - widgets:
      - name: xg_differential_footnote
        type: text
        col: 12
        content: |
          **Sources:** **[FIFA Training Centre](https://www.fifatrainingcentre.com/)** public post-match reports (use subject to FIFA website terms).

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** The teams faced different opponents. This is a descriptive eight-match comparison, not an opponent-adjusted model or strength rating.

  - widgets:
      - name: match_components_header
        type: text
        col: 12
        content: |
          # Goals, xG, and xG conceded by tournament match

          **Argentina scored 19 goals from 15.44 xG; Spain scored 14 from 17.48 xG.** The selector lets you inspect where each scoreline and chance-quality estimate did, or did not, line up, including the final.

          **Encoding:** x-axis = reported match for the selected team. y-axis = goals or expected goals, both count-equivalent. Grouped bars and the legend distinguish goals scored, xG, and xG conceded.
  - widgets:
      - name: Goals and expected goals by match
        type: chart
        chart: combo
        col: 12
        yMin: "0"
        sql: |
          SELECT
            match_label,
            goals AS goals_scored,
            xg AS expected_goals,
            xg_conceded AS expected_goals_conceded
          FROM `bruin-playground-arsalan.final_reports.goals_xg_match`
          WHERE team_name = '{{ filters.team }}'
          ORDER BY match_number
        x: { field: match_label, type: category }
        y: { field: [goals_scored, expected_goals, expected_goals_conceded], type: number, format: ".2f" }
  - widgets:
      - name: match_components_footnote
        type: text
        col: 12
        content: |
          **Sources:** **[FIFA Training Centre](https://www.fifatrainingcentre.com/)** public post-match reports (use subject to FIFA website terms).

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Goals and xG share a count scale, but xG is a modelled chance-quality estimate. It describes chance quality; it is not a strength rating.

  - widgets:
      - name: squads_header
        type: text
        col: 12
        content: |
          # Official 26-player squads and tournament starts

          **Both lists contain 26 players.** The starts column covers all eight completed reports, including the final. It is usage context, not a measure of player quality.
  - widgets:
      - name: Official squad table
        type: table
        col: 12
        sql: |
          SELECT squad_number, player_name, position, club, tournament_starts, coach, source_version
          FROM `bruin-playground-arsalan.final_reports.official_squads`
          WHERE team_name = '{{ filters.team }}'
          ORDER BY squad_number
        columns:
          - { name: squad_number, label: "No.", format: ".0f" }
          - { name: player_name, label: "Player" }
          - { name: position, label: "Position" }
          - { name: club, label: "Club" }
          - { name: tournament_starts, label: "Tournament starts", format: ".0f" }
          - { name: coach, label: "Head coach" }
          - { name: source_version, label: "FIFA source version" }
  - widgets:
      - name: squads_footnote
        type: text
        col: 12
        content: |
          **Sources:** **[FIFA](https://www.fifa.com/)** official squad-list PDFs (use subject to FIFA website terms).

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Club, caps, goals, and squad status are values in the published PDF version. FIFA can revise them after this snapshot.

  - widgets:
      - name: h2h_header
        type: text
        col: 12
        content: |
          # Senior men's Argentina–Spain record: 15 matches, Argentina 6–2–7

          **Spain's final win moved the series to six Argentina wins, two draws, and seven Spain wins.** The older history goes back decades, so it is context, not evidence about these squads.

          **Encoding:** each row is one match. Results are from Argentina's perspective: W = win, D = draw, L = loss.
  - widgets:
      - name: Historical head-to-head results
        type: table
        col: 12
        sql: |
          SELECT FORMAT_DATE('%d %b %Y', match_date) AS match_date, fixture, competition, venue, scoreline, argentina_outcome
          FROM `bruin-playground-arsalan.final_reports.h2h_history`
          ORDER BY match_date
        columns:
          - { name: match_date, label: "Date" }
          - { name: fixture, label: "Fixture" }
          - { name: competition, label: "Competition" }
          - { name: venue, label: "Venue" }
          - { name: scoreline, label: "Score" }
          - { name: argentina_outcome, label: "Argentina result" }
  - widgets:
      - name: h2h_footnote
        type: text
        col: 12
        content: |
          **Sources:** **[11v11](https://www.11v11.com/)** public historical match records through 2018 (secondary source; use subject to 11v11 website terms) and the **[FIFA Training Centre](https://www.fifatrainingcentre.com/)** final report.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** 11v11 supplies the older series; FIFA supplies the 2026 final. Historical results are context, not evidence about the current squads.

  - widgets:
      - name: takeaways_header
        type: text
        col: 12
        content: |
          # Findings that made it past the data checks

          **These are the numbers that survived the proper checks.** The table stays empty unless both teams have all eight reports and the core metrics are there. No finding is prewritten to fit a story.
  - widgets:
      - name: Evidence-based findings
        type: table
        col: 12
        sql: |
          SELECT evidence_area, finding, caveat
          FROM `bruin-playground-arsalan.final_reports.evidence_findings`
          ORDER BY finding_order
        columns:
          - { name: evidence_area, label: "Evidence area" }
          - { name: finding, label: "Computed finding" }
          - { name: caveat, label: "Caveat" }

  - widgets:
      - name: methodology
        type: text
        col: 12
        content: |
          ## Methodology

          FIFA provides the current match reports and squad lists. The pipeline finds the public group and knockout report hubs, includes the completed final, hashes each PDF, parses typed facts, and keeps the latest raw fact in BigQuery. 11v11 provides the historical series through 2018 and stays labelled as a secondary source; FIFA supplies the 2026 final in the head-to-head table.

          FIFA phase values can overlap, so this dashboard never adds them into a fake 100% total. Everything here is a completed-tournament descriptive record, not a model, betting advice, or an opponent-adjusted rating.
