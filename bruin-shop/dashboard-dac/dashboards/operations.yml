name: Bruin Shop Operations
description: Payment exceptions, fulfillment status, and inventory coverage analysis.
connection: bruin-playground-arsalan
theme: ibm-cb-dark

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: payment_status
    type: select
    default: All payment statuses
    options:
      values: [All payment statuses, Paid, Partially refunded, Pending, Voided]
  - name: fulfillment_status
    type: select
    default: All fulfillment statuses
    options:
      values: [All fulfillment statuses, Fulfilled, Partial, Unfulfilled]
  - name: category
    type: select
    default: All categories
    options:
      values: [All categories, T-shirts, Pants, Shoes, Accessories]
  - name: event_type
    type: select
    default: All event types
    options:
      values: [All event types, Failed campaign, Stockout campaign, Website outage, Successful campaign, Product defect]

rows:
  - widgets:
      - name: Operations overview
        type: text
        col: 12
        content: |
          # Payments, fulfillment, and inventory operations

          This page uses the operational fields available in the template: Shopify-style payment status, fulfillment status, cancellation fields, and product inventory. Shipment-level carrier and delivery facts are not generated, so fulfillment status remains the shipment proxy.

  - widgets:
      - name: Paid order share
        type: metric
        col: 3
        column: value
        suffix: "%"
        format: number
        sql: |
          SELECT ROUND(SAFE_DIVIDE(COUNTIF(payment_status IN ('paid', 'partially_refunded')), COUNT(*)) * 100, 2) AS value
          FROM `bruin-playground-arsalan.staging.stg_orders`
          WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND ('{{ filters.payment_status }}' = 'All payment statuses' OR payment_status = CASE '{{ filters.payment_status }}' WHEN 'Paid' THEN 'paid' WHEN 'Partially refunded' THEN 'partially_refunded' WHEN 'Pending' THEN 'pending' WHEN 'Voided' THEN 'voided' END)
            AND ('{{ filters.fulfillment_status }}' = 'All fulfillment statuses' OR fulfillment_status = CASE '{{ filters.fulfillment_status }}' WHEN 'Fulfilled' THEN 'fulfilled' WHEN 'Partial' THEN 'partial' WHEN 'Unfulfilled' THEN 'unfulfilled' END)
            AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
            AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

      - name: Voided orders
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT COUNTIF(payment_status = 'voided') AS value
          FROM `bruin-playground-arsalan.staging.stg_orders`
          WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND ('{{ filters.payment_status }}' = 'All payment statuses' OR payment_status = CASE '{{ filters.payment_status }}' WHEN 'Paid' THEN 'paid' WHEN 'Partially refunded' THEN 'partially_refunded' WHEN 'Pending' THEN 'pending' WHEN 'Voided' THEN 'voided' END)
            AND ('{{ filters.fulfillment_status }}' = 'All fulfillment statuses' OR fulfillment_status = CASE '{{ filters.fulfillment_status }}' WHEN 'Fulfilled' THEN 'fulfilled' WHEN 'Partial' THEN 'partial' WHEN 'Unfulfilled' THEN 'unfulfilled' END)
            AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
            AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

      - name: Partial fulfillments
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT COUNTIF(fulfillment_status = 'partial') AS value
          FROM `bruin-playground-arsalan.staging.stg_orders`
          WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
              AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND ('{{ filters.payment_status }}' = 'All payment statuses' OR payment_status = CASE '{{ filters.payment_status }}' WHEN 'Paid' THEN 'paid' WHEN 'Partially refunded' THEN 'partially_refunded' WHEN 'Pending' THEN 'pending' WHEN 'Voided' THEN 'voided' END)
            AND ('{{ filters.fulfillment_status }}' = 'All fulfillment statuses' OR fulfillment_status = CASE '{{ filters.fulfillment_status }}' WHEN 'Fulfilled' THEN 'fulfilled' WHEN 'Partial' THEN 'partial' WHEN 'Unfulfilled' THEN 'unfulfilled' END)
            AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
            AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

      - name: Inventory value
        type: metric
        col: 3
        column: value
        prefix: "$"
        format: number
        sql: |
          SELECT ROUND(SUM(COALESCE(inventory_value_usd, 0)), 2) AS value
          FROM `bruin-playground-arsalan.reports.rpt_product_performance` p
          WHERE '{{ filters.category }}' = 'All categories'
            OR p.category = '{{ filters.category }}'

  - widgets:
      - name: Fulfillment header
        type: text
        col: 12
        content: |
          # Fulfillment status order count, 2025-01-01 to 2026-06-05

          **Most orders are fulfilled, but the generated data now has enough exception volume for realistic testing: 545,635 fulfilled orders, 89,516 partial fulfillments, and 30,325 unfulfilled orders.**

          **X-axis:** fulfillment status. **Y-axis:** order count. **Bars:** orders by status.

  - widgets:
      - name: Fulfillment status order count
        type: chart
        chart: bar
        col: 12
        file: queries/fulfillment_status_summary.sql
        x: fulfillment_status
        y: [orders]

  - widgets:
      - name: Fulfillment footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Shopify** fulfillment status from `staging.stg_orders`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Fulfillment status is an order-level proxy. The template does not include shipment packages, carriers, tracking events, promised delivery dates, or delivery outcomes.

  - widgets:
      - name: Inventory header
        type: text
        col: 12
        content: |
          # Inventory value by product category (USD)

          **The active catalog has 120 apparel products and $13.3M of generated inventory value. Category ranking is driven by list price, available units, and the primary-product sales attribution used in the report layer.**

          **X-axis:** product category. **Y-axis:** inventory value in USD. **Bars:** available units multiplied by catalog price.

  - widgets:
      - name: Inventory value by category
        type: chart
        chart: bar
        col: 12
        file: queries/category_price_inventory.sql
        x: category
        y: [inventory_value_usd]

  - widgets:
      - name: Inventory footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Shopify** products, primary-product sales attribution, and product-level inventory totals from `reports.rpt_product_performance`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Inventory value uses list price, not reserved inventory or a historical daily stock ledger. Product sales are attributed to one generated primary product per order because full line-item arrays are out of scope.

  - widgets:
      - name: Operations table header
        type: text
        col: 12
        content: |
          # Payment and fulfillment status matrix, 2025-01-01 to 2026-06-05

          **Payment and fulfillment exceptions are intentionally independent enough to test operational workflows at scale. Review partially refunded, pending, and voided rows separately from partial and unfulfilled rows rather than treating one status as a proxy for the other.**

          **Columns:** payment status, fulfillment status, orders, gross revenue in USD, and average order value in USD.

  - widgets:
      - name: Payment and fulfillment matrix
        type: table
        col: 12
        file: queries/order_status_matrix.sql
        columns:
          - { name: payment_status, label: Payment status }
          - { name: fulfillment_status, label: Fulfillment status }
          - { name: orders, label: Orders, format: number }
          - { name: gross_revenue_usd, label: "Gross revenue (USD)", format: number }
          - { name: avg_order_value_usd, label: "Avg order value (USD)", format: number }

  - widgets:
      - name: Payment reconciliation header
        type: text
        col: 12
        content: |
          # Shopify and Stripe payment reconciliation by day

          **The synthetic Stripe layer now reconciles to Shopify order attempts: every order attempt has one payment intent, successful Shopify orders map to succeeded Stripe intents, and partially refunded Shopify orders map to Stripe refund records. The gap columns should stay at zero in a healthy generated run.**

          **Columns:** report date, Shopify order counts, Stripe payment-intent counts, Stripe refund amount in USD, and reconciliation gaps.

  - widgets:
      - name: Shopify and Stripe payment reconciliation
        type: table
        col: 12
        file: queries/payment_reconciliation.sql
        columns:
          - { name: report_date, label: Report date }
          - { name: shopify_order_attempts, label: Shopify attempts, format: number }
          - { name: shopify_successful_orders, label: Shopify successful, format: number }
          - { name: stripe_payment_intents, label: Stripe intents, format: number }
          - { name: stripe_succeeded_intents, label: Stripe succeeded, format: number }
          - { name: shopify_partially_refunded_orders, label: Shopify partial refunds, format: number }
          - { name: stripe_refunds, label: Stripe refunds, format: number }
          - { name: stripe_refund_amount_usd, label: "Stripe refund amount (USD)", format: number }
          - { name: successful_order_gap, label: Successful order gap, format: number }
          - { name: refund_record_gap, label: Refund record gap, format: number }

  - widgets:
      - name: Payment reconciliation footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Shopify** order statuses from `staging.stg_orders` and synthetic **Stripe** payment intents/refunds from `raw.stripe_payment_intents` and `raw.stripe_refunds`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Stripe records are generated from Shopify order facts for reconciliation testing. They do not model real processor authorization retries, disputes, asynchronous webhooks, charge objects, or payout timing.

  - widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          # Methodology

          Operational metrics come from `staging.stg_orders`, `reports.rpt_product_performance`, and `reports.rpt_payment_reconciliation`. Paid order share counts `paid` and `partially_refunded` orders as paid. Inventory value multiplies generated product inventory units by active product list price. Synthetic Stripe payment intents are generated one-for-one from Shopify order attempts; succeeded intents map to paid and partially refunded Shopify orders, and Stripe refunds map to partially refunded orders. The template does not model shipment packages, warehouse locations, historical inventory movements, delivery SLAs, real payment-processor webhook timing, charge disputes, or payouts.
