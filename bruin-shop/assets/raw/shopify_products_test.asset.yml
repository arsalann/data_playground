name: raw.shopify_products_test
type: ingestr
connection: bruin-playground-arsalan
description: |
  Connection-test asset that ingests Shopify products into BigQuery with
  Bruin's built-in ingestr runner. This table is intentionally suffixed `_test`
  and is not consumed by the demo staging, report, or dashboard assets.

parameters:
  source_connection: bruin-shop-shopify-test
  source_table: products
  destination: bigquery
  incremental_strategy: merge
  incremental_key: updated_at

columns:
  - name: id
    type: VARCHAR
    primary_key: true
    description: Shopify product identifier.
  - name: updated_at
    type: TIMESTAMP
    description: Timestamp when the Shopify product was last updated.
  - name: created_at
    type: TIMESTAMP
    description: Timestamp when the Shopify product was created.
  - name: title
    type: VARCHAR
    description: Shopify product title.
