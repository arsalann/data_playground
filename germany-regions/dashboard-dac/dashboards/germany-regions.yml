    col: 12
    content: |
      **Sources:** **[Destatis GENESIS-Online, table 12411-0010](https://www-genesis.destatis.de/datenbank/online/table/12411-0010)** and the other GENESIS tables listed, Arbeitskreis VGR der Länder, Eurostat; licence dl-de/by-2-0 / licence CC BY 4.0.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Latest year available reflects what the pipeline ingested on its last run (September 2026). 2025 values from the regional accounts and the life table are first releases and may be revised.
- tab: Data quality & methodology
  widgets:
  - name: quality_divider
    type: divider
    col: 12
- tab: Data quality & methodology
  widgets:
  - name: methodology
    type: text
    col: 12
    content: |
      # Methodology

      **Reference year rule.** Every map compares states within a single reference year. The pipeline ingests the last four years of each source and the dashboard shows the fixed reference year defined in `staging.de_indicator_catalog`: 2025 for fifteen indicators, 2024 for disposable income (latest release). No 2026 annual values exist yet for any state-level indicator. A data check fails the pipeline if any mapped indicator has fewer than 16 states or more than one year.

      **Sources.** Destatis GENESIS-Online REST API (population, area, age and citizenship, births, migration, registered unemployment, land prices, earnings, life tables); Arbeitskreis Volkswirtschaftliche Gesamtrechnungen der Länder (GDP and disposable income per inhabitant, Excel releases); Eurostat dissemination API (employment rate, tertiary education, at-risk-of-poverty rate, NUTS 1). State boundaries: Eurostat GISCO NUTS 2024 at 1:10 million.

      **Derived values.** Population density = population on 31 Dec 2025 / area on 31 Dec 2023. Shares aged 65+ and without German citizenship are computed from population by single year of age and citizenship (table 12411-0014). Net migration per 1,000 = net moves across state borders (including abroad) / mean population of 31 Dec 2024 and 2025. All other values are used as published.

      **Joins.** Destatis tables use the official state code (AGS 01-16); Eurostat uses NUTS 1 codes (DE1-DEG); VGRdL uses state names. `staging.de_states` maps all three. The Germany value is the published national figure where one exists, otherwise the sum of the 16 states.

      **Maps.** State polygons are GISCO NUTS 2024 boundaries (1:10 million) drawn with Vega-Lite geoshape in a Mercator projection; the geometry is read from the warehouse when the dashboard file is generated and joined to each query's values by NUTS 1 code. Colour scales are a single sequential blue (near-white = lowest, dark blue = highest), readable with any form of colour vision deficiency; every map is paired with a ranked bar chart and value labels so that no value depends on colour alone.

      **Limitations.** Sixteen states are large and unequal units: averages hide differences inside Bayern or Nordrhein-Westfalen, and the city-states combine urban cores without their suburbs. Values are in current prices and are not adjusted for regional price levels. Survey-based indicators (employment, tertiary education, poverty risk) carry sampling error, largest for Bremen and Saarland.
