          - { name: losses, label: Losses, number: ",.0f" }
          - { name: actual_score_pct, label: Actual score (%), number: ",.1f" }
          - { name: expected_score_proxy_pct, label: Expected score proxy (%), number: ",.1f" }
          - { name: performance_residual_proxy_pp, label: Residual (pp), number: ",.1f" }
