              labelLimit: 220
              labelFontSize: 11
          x:
            field: value
            type: quantitative
            title: per 1,000 residents
            scale:
              zero: true
            axis:
              format: .1f
              tickCount: 5
          fill:
            field: value
            type: quantitative
            scale:
              range:
              - '#f7fbff'
              - '#deebf7'
              - '#c6dbef'
              - '#9ecae1'
              - '#6baed6'
              - '#4292c6'
              - '#2171b5'
