        type: text
        col: 12
        content: |
          **Sources:** **[Chess.com Published Data API](https://www.chess.com/news/view/published-data-api)** public opponents, ratings, timestamps, and results for the **peterthiel** account.

          **Tools:** **Bruin cli** (reporting), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** These matchups are not independent trials, and opponent accounts may represent a changing person or strength over time. The public rating comparison reconstructs only the target account's prior rating; the opponent rating is a post-game snapshot. “Surprise” is a transparent selection rule, not proof of a psychological matchup effect.

