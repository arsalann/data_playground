      # Operations

      This tab checks whether generated payment, fulfillment, inventory, and Stripe reconciliation signals behave like real operating controls.

- tab: Operations
  widgets:
  - name: Paid order share
    type: metric
    col: 3
    column: value
    suffix: "%"
    format: number
    sql: |
      SELECT ROUND(SAFE_DIVIDE(COUNTIF(payment_status IN ('paid', 'partially_refunded')), COUNT(*)) * 100, 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.payment_status }}' = 'All payment statuses' OR payment_status = CASE '{{ filters.payment_status }}' WHEN 'Paid' THEN 'paid' WHEN 'Partially refunded' THEN 'partially_refunded' WHEN 'Pending' THEN 'pending' WHEN 'Voided' THEN 'voided' END)
        AND ('{{ filters.fulfillment_status }}' = 'All fulfillment statuses' OR fulfillment_status = CASE '{{ filters.fulfillment_status }}' WHEN 'Fulfilled' THEN 'fulfilled' WHEN 'Partial' THEN 'partial' WHEN 'Unfulfilled' THEN 'unfulfilled' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Voided orders
    type: metric
    col: 3
    column: value
    format: number
    sql: |
      SELECT COUNTIF(payment_status = 'voided') AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.payment_status }}' = 'All payment statuses' OR payment_status = CASE '{{ filters.payment_status }}' WHEN 'Paid' THEN 'paid' WHEN 'Partially refunded' THEN 'partially_refunded' WHEN 'Pending' THEN 'pending' WHEN 'Voided' THEN 'voided' END)
        AND ('{{ filters.fulfillment_status }}' = 'All fulfillment statuses' OR fulfillment_status = CASE '{{ filters.fulfillment_status }}' WHEN 'Fulfilled' THEN 'fulfilled' WHEN 'Partial' THEN 'partial' WHEN 'Unfulfilled' THEN 'unfulfilled' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Partial fulfillments
    type: metric
    col: 3
    column: value
    format: number
    sql: |
      SELECT COUNTIF(fulfillment_status = 'partial') AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.payment_status }}' = 'All payment statuses' OR payment_status = CASE '{{ filters.payment_status }}' WHEN 'Paid' THEN 'paid' WHEN 'Partially refunded' THEN 'partially_refunded' WHEN 'Pending' THEN 'pending' WHEN 'Voided' THEN 'voided' END)
        AND ('{{ filters.fulfillment_status }}' = 'All fulfillment statuses' OR fulfillment_status = CASE '{{ filters.fulfillment_status }}' WHEN 'Fulfilled' THEN 'fulfilled' WHEN 'Partial' THEN 'partial' WHEN 'Unfulfilled' THEN 'unfulfilled' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Inventory value
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT ROUND(SUM(COALESCE(inventory_value_usd, 0)), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_reports.rpt_product_performance` p
      WHERE '{{ filters.category }}' = 'All categories'
        OR p.category = '{{ filters.category }}'

