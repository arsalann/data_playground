name: Bruin Shop
description: Tabbed ecommerce validation dashboard covering sales, marketing, operations, customers, catalog, and synthetic
  special events.
connection: bruin-playground-arsalan
theme: vibrant-shop

filters:
- name: date_range
  type: date-range
  default: all_time
- name: channel
  type: select
  default: All channels
  options:
    values: [All channels, Paid social, Paid search, Email, Organic search, Direct]
- name: category
  type: select
  default: All categories
  options:
    values: [All categories, T-shirts, Pants, Shoes, Accessories]
- name: event_type
  type: select
  default: All event types
  options:
    values: [All event types, Failed campaign, Stockout campaign, Website outage, Successful campaign, Product defect]
- name: payment_status
  type: select
  default: All payment statuses
  options:
    values: [All payment statuses, Paid, Partially refunded, Pending, Voided]
- name: fulfillment_status
  type: select
  default: All fulfillment statuses
  options:
    values: [All fulfillment statuses, Fulfilled, Partial, Unfulfilled]

rows:
- tab: Executive Brief
  widgets:
  - name: Executive brief
    type: text
    col: 12
    content: |
      # Executive brief

      The demo story: paid social and shoes create most of the profit, while failed campaigns, stockouts, fulfillment gaps, product defects, and seasonal campaign swings create the visible risk signatures.

- tab: Executive Brief
  widgets:
  - name: Net revenue
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT CAST(ROUND(SUM(CASE WHEN payment_status IN ('paid', 'partially_refunded') THEN order_total ELSE 0 END), 0) AS INT64) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Contribution profit
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      WITH orders AS (
        SELECT ROUND(SUM(CASE
          WHEN payment_status IN ('paid', 'partially_refunded')
            THEN order_total - COALESCE(cogs_amount, 0) - COALESCE(shipping_cost, 0)
          ELSE 0
        END), 2) AS gross_profit
        FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
        WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
            AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
          AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
          AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
          AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)
      ),
      spend AS (
        SELECT ROUND(SUM(total_spend), 2) AS media_spend
        FROM `bruin-playground-arsalan.bruin_shop_reports.rpt_marketing_roi`
        WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
            AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
          AND ('{{ filters.channel }}' = 'All channels' OR channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
      )
      SELECT CAST(ROUND(gross_profit - COALESCE(media_spend, 0), 0) AS INT64) AS value
      FROM orders
      CROSS JOIN spend

  - name: Paid social profit
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT CAST(ROUND(SUM(contribution_profit), 0) AS INT64) AS value
      FROM `bruin-playground-arsalan.bruin_shop_reports.rpt_marketing_roi`
      WHERE channel = 'paid_ads'
        AND report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')

  - name: Exception orders
    type: metric
    col: 3
    column: value
    format: number
    sql: |
      SELECT COUNTIF(payment_status IN ('partially_refunded', 'pending', 'voided') OR fulfillment_status IN ('partial', 'unfulfilled')) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

- tab: Executive Brief
  widgets:
  - name: Growth engine
    type: text
    col: 4
    content: |
      ### Growth engine

      Paid social is the clearest growth engine: high revenue scale, positive contribution profit, and enough market detail to demo drill-down workflows.

  - name: Merchandise engine
    type: text
    col: 4
    content: |
      ### Merchandise engine

      Shoes carry the merchandise economics: high gross profit, high inventory value, and the strongest category margin profile.

  - name: Risk engine
    type: text
    col: 4
    content: |
      ### Risk engine

      The injected incidents are visible without reading raw rows: failed search burns spend, the outage crushes sessions, the tote defect spikes refunds, and seasonal campaigns change paid-search volume.

- tab: Executive Brief
  widgets:
  - name: Margin bridge header
    type: text
    col: 12
    content: |
      # Revenue to contribution profit bridge

      The store is profitable after COGS, shipping, and media spend, but paid acquisition consumes enough gross profit that mix matters.

      **Encoding:** X-axis shows profit bridge stage. Y-axis shows amount (USD). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Executive Brief
  widgets:
  - name: Revenue to contribution profit bridge
    type: chart
    chart: bar
    col: 12
    file: queries/executive_margin_bridge.sql
    x: stage
    y: [amount_usd]
- tab: Executive Brief
  widgets:
  - name: Revenue to contribution profit bridge footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_staging.stg_orders` and `bruin_shop_reports.rpt_marketing_roi`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Synthetic COGS, shipping, and media-spend assumptions are generated for demo reconciliation, not finance reporting.
- tab: Executive Brief
  widgets:
  - name: Channel profit header
    type: text
    col: 12
    content: |
      # Channel contribution profit share

      Paid social leads contribution profit; organic and email look efficient because they carry no generated media spend.

      **Encoding:** X-axis shows channel. Y-axis shows contribution profit (USD). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Executive Brief
  widgets:
  - name: Channel profit stack
    type: chart
    chart: bar
    col: 12
    file: queries/executive_channel_profit.sql
    x: channel
    y:
    - contribution_profit_usd
- tab: Executive Brief
  widgets:
  - name: Channel profit stack footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_reports.rpt_marketing_roi`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Channel attribution is exact inside the generated model and should not be read as real incrementality.
- tab: Executive Brief
  widgets:
  - name: Event impact header
    type: text
    col: 12
    content: |
      # Event impact ranking

      The failed search test is the worst revenue miss, while successful campaigns produce short, profitable bursts.

      **Encoding:** X-axis shows event. Y-axis shows revenue delta (USD). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Executive Brief
  widgets:
  - name: Special event impact ranking
    type: chart
    chart: bar
    col: 12
    file: queries/executive_event_impact.sql
    x: event_label
    y: [revenue_delta_usd]
- tab: Executive Brief
  widgets:
  - name: Special event impact ranking footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_reports.rpt_special_event_impact`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Event deltas compare deterministic event windows with generated prior baselines; injected effects are intentionally strong.
- tab: Executive Brief
  widgets:
  - name: Category economics header
    type: text
    col: 12
    content: |
      # Category gross profit share

      Shoes are the category to defend: they deliver the largest gross-profit pool and the strongest margin profile.

      **Encoding:** X-axis shows category. Y-axis shows gross profit (USD). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Executive Brief
  widgets:
  - name: Category economics
    type: chart
    chart: bar
    col: 12
    file: queries/executive_category_economics.sql
    x: category
    y:
    - gross_profit_usd
- tab: Executive Brief
  widgets:
  - name: Category economics footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_reports.rpt_product_performance`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Product economics use primary-product attribution, not full order line-item allocation.
- tab: Executive Brief
  widgets:
  - name: Exception leakage header
    type: text
    col: 12
    content: |
      # Operational exception leakage

      Partial fulfillment is the largest operational leak, followed by unfulfilled orders and refund-related payment exceptions.

      **Encoding:** X-axis shows exception type. Y-axis shows order share (%). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Executive Brief
  widgets:
  - name: Operational exception order share
    type: chart
    chart: bar
    col: 12
    file: queries/executive_exception_leakage.sql
    x: exception_type
    y: [order_share_pct]
- tab: Executive Brief
  widgets:
  - name: Operational exception order share footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_staging.stg_orders`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Exception categories can overlap; this view is a demo triage summary, not an audited incident count.
- tab: Executive Brief
  widgets:
  - name: Executive methodology
    type: text
    col: 12
    content: |
      # Methodology

      The executive brief combines `bruin_shop_staging.stg_orders`, `bruin_shop_reports.rpt_marketing_roi`, `bruin_shop_reports.rpt_product_performance`, and `bruin_shop_reports.rpt_special_event_impact`. Revenue means paid and partially refunded Shopify-style order totals. Gross profit subtracts generated COGS and shipping cost. Contribution profit subtracts generated media spend from gross profit. Event deltas compare event windows with generated same-length prior baselines. Product economics use primary-product attribution because full line-item arrays remain out of scope.

- tab: Sales
  widgets:
  - name: Sales overview
    type: text
    col: 12
    content: |
      # Sales

      Synthetic Shopify-style orders are healthy overall, with enough payment exceptions to demo monitoring and reconciliation.

- tab: Sales
  widgets:
  - name: Gross revenue
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT ROUND(SUM(order_total), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Net revenue
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT ROUND(SUM(CASE WHEN payment_status IN ('paid', 'partially_refunded') THEN order_total ELSE 0 END), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Avg order value
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT ROUND(SAFE_DIVIDE(SUM(CASE WHEN payment_status IN ('paid', 'partially_refunded') THEN order_total ELSE 0 END), COUNTIF(payment_status IN ('paid', 'partially_refunded'))), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
      WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
        AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
        AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)

  - name: Cancellation rate
    type: metric
    col: 3
    column: value
    suffix: "%"
    format: number
    sql: |
      SELECT ROUND(SAFE_DIVIDE(SUM(cancelled_orders), SUM(total_orders)) * 100, 2) AS value
      FROM (
        SELECT
          COUNT(*) AS total_orders,
          COUNTIF(cancel_reason IS NOT NULL) AS cancelled_orders
        FROM `bruin-playground-arsalan.bruin_shop_staging.stg_orders`
        WHERE DATE(order_date) BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
            AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
          AND ('{{ filters.channel }}' = 'All channels' OR source_channel = CASE '{{ filters.channel }}' WHEN 'Paid social' THEN 'paid_ads' WHEN 'Paid search' THEN 'paid_search' WHEN 'Email' THEN 'email' WHEN 'Organic search' THEN 'organic_search' WHEN 'Direct' THEN 'direct' END)
          AND ('{{ filters.category }}' = 'All categories' OR primary_category = '{{ filters.category }}')
          AND ('{{ filters.event_type }}' = 'All event types' OR special_event_type = CASE '{{ filters.event_type }}' WHEN 'Failed campaign' THEN 'failed_campaign' WHEN 'Stockout campaign' THEN 'stockout_campaign' WHEN 'Website outage' THEN 'website_outage' WHEN 'Successful campaign' THEN 'successful_campaign' WHEN 'Product defect' THEN 'product_defect' END)
      )

- tab: Sales
  widgets:
  - name: Revenue quality header
    type: text
    col: 12
    content: |
      # Gross versus net revenue

      Net revenue tracks close to gross revenue, so payment exceptions are visible but not large enough to distort the main sales trend.

      **Encoding:** X-axis shows date. Y-axis shows gross revenue (USD), net revenue (USD). Line color and legend distinguish the series; the header text remains the fallback legend.

- tab: Sales
  widgets:
  - name: Daily gross and net revenue
    type: chart
    chart: combo
    col: 12
    file: queries/daily_sales_quality.sql
    x: day_label
    y: [gross_revenue_usd, net_revenue_usd]
    lines: [gross_revenue_usd, net_revenue_usd]
- tab: Sales
  widgets:
  - name: Daily gross and net revenue footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_staging.stg_orders`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Date filters can shorten the generated window; synthetic payment exceptions drive the gross/net gap.
- tab: Sales
  widgets:
  - name: AOV header
    type: text
    col: 12
    content: |
      # Average order value

      AOV stays stable enough to make event spikes obvious instead of hiding them inside pricing noise.

      **Encoding:** X-axis shows date. Y-axis shows average order value (USD). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Sales
  widgets:
  - name: Daily AOV and gross margin
    type: chart
    chart: line
    col: 12
    file: queries/daily_sales_quality.sql
    x: day_label
    y: [avg_order_value_usd]
- tab: Sales
  widgets:
  - name: Daily AOV and gross margin footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_staging.stg_orders`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** AOV is generated from synthetic apparel baskets and does not represent real pricing behavior.
- tab: Sales
  widgets:
  - name: Payment table header
    type: text
    col: 12
    content: |
      # Payment status share

      Paid orders dominate, but partially refunded, pending, and voided orders are large enough to test exception dashboards.

      **Encoding:** X-axis shows payment status. Y-axis shows orders (count). Bar or line length/position encodes the metric; labels remain available in tooltips.

- tab: Sales
  widgets:
  - name: Payment status order share
    type: chart
    chart: bar
    col: 12
    file: queries/payment_status_summary.sql
    x: payment_status
    y:
    - orders
- tab: Sales
  widgets:
  - name: Payment status order share footnote
    type: text
    col: 12
    content: |
      **Sources:** Synthetic Bruin Shop data generated in this repository and materialized in BigQuery from `bruin_shop_staging.stg_orders`.

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** Payment statuses are synthetic Shopify-style states reconciled to generated Stripe records.
- tab: Marketing
  widgets:
  - name: Marketing overview
    type: text
    col: 12
    content: |
      # Marketing

      This tab focuses on profitable acquisition: where spend scales, where contribution profit holds, and where the funnel breaks.

- tab: Marketing
  widgets:
  - name: Paid spend
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT ROUND(SUM(total_spend), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_reports.rpt_marketing_roi`
      WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND channel IN ('paid_search', 'paid_ads')
        AND (
          '{{ filters.channel }}' = 'All channels'
          OR channel = CASE '{{ filters.channel }}'
            WHEN 'Paid social' THEN 'paid_ads'
            WHEN 'Paid search' THEN 'paid_search'
            WHEN 'Email' THEN 'email'
            WHEN 'Organic search' THEN 'organic_search'
            WHEN 'Direct' THEN 'direct'
          END
        )

  - name: Attributed revenue
    type: metric
    col: 3
    column: value
    prefix: "$"
    format: number
    sql: |
      SELECT ROUND(SUM(attributed_revenue), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_reports.rpt_marketing_roi`
      WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND (
          '{{ filters.channel }}' = 'All channels'
          OR channel = CASE '{{ filters.channel }}'
            WHEN 'Paid social' THEN 'paid_ads'
            WHEN 'Paid search' THEN 'paid_search'
            WHEN 'Email' THEN 'email'
            WHEN 'Organic search' THEN 'organic_search'
            WHEN 'Direct' THEN 'direct'
          END
        )

  - name: Paid ROAS
    type: metric
    col: 3
    column: value
    suffix: "x"
    format: number
    sql: |
      SELECT ROUND(SAFE_DIVIDE(SUM(attributed_revenue), NULLIF(SUM(total_spend), 0)), 2) AS value
      FROM `bruin-playground-arsalan.bruin_shop_reports.rpt_marketing_roi`
      WHERE report_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
          AND COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-08')
        AND channel IN ('paid_search', 'paid_ads')
        AND (
          '{{ filters.channel }}' = 'All channels'
          OR channel = CASE '{{ filters.channel }}'
            WHEN 'Paid social' THEN 'paid_ads'
            WHEN 'Paid search' THEN 'paid_search'
            WHEN 'Email' THEN 'email'
            WHEN 'Organic search' THEN 'organic_search'
            WHEN 'Direct' THEN 'direct'
          END
        )

  - name: Web sessions
    type: metric
    col: 3
    column: value
    format: number
    sql: |
      SELECT SUM(total_sessions) AS value
      FROM `bruin-playground-arsalan.bruin_shop_staging.stg_web_sessions`
      WHERE session_date BETWEEN COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
