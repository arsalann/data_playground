- tab: Methodology
  widgets:
  - name: Methodology and caveats
    type: text
    col: 12
    content: |
      # Methodology and caveats

      Purpose: Bruin Shop is a synthetic ecommerce demo for Bruin pipelines and DAC dashboards. The dashboard should highlight generated business patterns, not serve as a public KPI report.

      **Sources:** Fake same-schema Shopify, Stripe, GA4, Meta Ads, Google Ads, Klaviyo, HubSpot, market-calendar, and special-event inputs materialized under `bruin_shop_raw`, `bruin_shop_staging`, and `bruin_shop_reports` in BigQuery.

      **Tools:** **Bruin cli** for assets and validation, **BigQuery** for warehouse execution, and **Bruin dac** for dashboard rendering.

      **Limitations:** Attribution, cohorts, inventory, refunds, outage behavior, and campaign effects are deterministic synthetic scenarios. They are designed to verify data contracts and demo analytical workflows, not to estimate real incrementality, finance-recognized revenue, processor settlement, shipment outcomes, or customer identity behavior.
