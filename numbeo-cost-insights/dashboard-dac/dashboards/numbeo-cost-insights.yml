        col: 12
        content: |
          **Sources:** **[Numbeo current city rankings](https://www.numbeo.com/cost-of-living/rankings_current.jsp)** (crowdsourced city cost, rent, and purchasing-power indices; New York City = 100).

          **Tools:** **Bruin cli** (ingestion and transformations), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Continent labels are a broad, hand-maintained grouping of Numbeo country labels; Russia and Turkey are assigned to Europe and Cyprus to Europe for this dashboard. The gap is an index difference, not a literal share of income. Coverage and contributor density vary by city.

