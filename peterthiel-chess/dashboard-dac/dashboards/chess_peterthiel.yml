          # Current Chess.com title-registry matches in the public 3+0 archive

          **The archive matches 623 distinct accounts on Chess.com's current titled-player registries, across 1,235 public 3+0 games. Six currently appear in the GM registry: vica56 is the most frequent at 39 games (15–2–22), while Hugooakland has the highest recorded opponent rating snapshot at 2,532.**

          **Columns:** title is the current public Chess.com registry label; score is % of possible points. **Ordering:** highest archived opponent post-game rating snapshot first.
