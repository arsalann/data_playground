            title: Value (per 1,000 residents)
          - field: reference_period
            title: Reference period
          - field: rank_desc
            title: Rank of 16 (1 = highest)
          - field: germany_value_label
            title: Germany (per 1,000 residents)
          - field: diff_to_germany_label
            title: Difference to Germany
      - transform:
        - joinaggregate:
          - op: min
            field: value
            as: vmin
          - op: max
            field: value
            as: vmax
        - calculate: (datum.value - datum.vmin) / (datum.vmax - datum.vmin)
          as: color_pos
        mark:
          type: text
          fontSize: 10.5
          fontWeight: 600
