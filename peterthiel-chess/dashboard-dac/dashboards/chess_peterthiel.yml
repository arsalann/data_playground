            last_game_utc
          FROM `bruin-playground-arsalan.chess_peterthiel.report_repeat_opponent_surprises`
          ORDER BY matchup_rank
        columns:
          - { name: matchup_rank, label: Rank, number: ",.0f" }
          - { name: opponent_username, label: Opponent }
          - { name: games, label: Games, number: ",.0f" }
