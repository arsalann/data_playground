name: bruin_shop_raw.hubspot_deals
type: ingestr
connection: bruin-playground-arsalan
description: |
  Ingests HubSpot deals into BigQuery with Bruin's built-in ingestr runner.
  This table is not currently consumed by the demo staging, report, or
  dashboard assets.

parameters:
  source_connection: bruin-shop-hubspot-test
  source_table: deals
  destination: bigquery
  incremental_strategy: merge
  incremental_key: hs_lastmodifieddate

columns:
  - name: hs_object_id
    type: VARCHAR
    primary_key: true
    description: HubSpot deal object identifier.
  - name: hs_lastmodifieddate
    type: TIMESTAMP
    description: Timestamp when the HubSpot deal was last modified.
  - name: createdate
    type: TIMESTAMP
    description: Timestamp when the HubSpot deal was created.
  - name: dealname
    type: VARCHAR
    description: HubSpot deal name.
