        encoding:
          y:
            field: state_label
            type: nominal
            title: null
            sort:
              field: value
              order: descending
            axis:
              labelLimit: 220
              labelFontSize: 11
          x:
            field: value
            type: quantitative
          text:
            field: value_label
      - transform:
        - filter: datum.rank_desc === 1
        - calculate: '''Germany: '' + datum.germany_value_label'
