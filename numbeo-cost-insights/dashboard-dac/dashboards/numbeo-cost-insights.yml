  - tab: Global
    widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          # Methodology

          **Source and snapshot:** The pipeline captures Numbeo's public current city and country ranking tables on each run and appends a dated snapshot. The staging layer deduplicates by entity plus snapshot date. The dashboard always selects the latest available snapshot.

          **Indices:** Numbeo sets New York City = 100 for the cost, rent, combined cost-plus-rent, groceries, restaurant, and local purchasing-power indices. The affordability gap is `cost_of_living_plus_rent_index - local_purchasing_power_index`; positive values flag indexed costs above indexed local buying power. The rent-burden ratio is `rent_index / local_purchasing_power_index`.

          **Interpretation:** These are comparative signals for exploration, not official inflation, poverty, or household-budget statistics. Numbeo combines user-contributed observations with automated market data and statistical validation; contributor coverage, recency, taxes, household composition, housing quality, and public services can materially change a person's lived affordability.

          **Reproducibility:** **[Numbeo cost-of-living database](https://www.numbeo.com/cost-of-living/)** → **Bruin** raw ingestion → BigQuery staging/report tables → **Bruin DAC** dashboard. A paid Numbeo API or data license may be required for commercial or high-volume use; this project uses the public ranking pages at modest frequency.
