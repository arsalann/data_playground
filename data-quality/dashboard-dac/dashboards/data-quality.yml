- widgets:
  - id: methodology
    name: Methodology
    type: text
    col: 12
    content: '# Methodology


      DUMMY DATA. The [synthetic fixture](https://github.com/arsalann/data_playground/tree/main/data-quality) preserves
      dashboard 1135’s equations for 1,000 synthetic users plus a daily unattributed AppLovin bucket, September
      6–October 5, 2026. Dates are inclusive.


      User counts are COUNT DISTINCT over the selected period; daily counts must not be added to obtain period users.
      The presence buckets are stable source memberships in this fixture. Revenue and events are additive; ratios
      and percentage differences are calculated from unrounded aggregate totals, relative to Adjust. Division by
      zero returns NULL. Unsupported AppLovin measurements remain NULL.


      AppLovin unattributed revenue and impressions enter source totals but never user counts or gap tables. Gap
      tables show the top 50 by the greatest absolute raw source revenue difference, breaking ties by date and user
      hash. User-level gaps aggregate within the selected period before ranking.


      All data-backed widgets reference repository semantic models; the dashboard contains no SQL or named query
      definitions. Metrics and dimensions are defined in the shared semantic catalog. No inference about real source
      quality can be made from this demo.'
