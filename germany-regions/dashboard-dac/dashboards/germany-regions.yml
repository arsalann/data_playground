        rank_desc, germany_value_label, diff_to_germany_label
      FROM `bruin-playground-arsalan.report.de_state_indicator_snapshot`
      WHERE indicator_id = 'gender_pay_gap'
    spec:
      projection:
        type: mercator
      datasets:
        states: *id001
      layer:
      - transform:
        - lookup: nuts1_id
          from:
            data:
              name: states
            key: properties.nuts1_id
          as: geo
        mark:
          type: geoshape
          stroke: '#0b0e14'
          strokeWidth: 0.8
          strokeJoin: round
        encoding:
          shape:
            field: geo
            type: geojson
          fill:
            field: value
            type: quantitative
            scale:
              range:
              - '#f7fbff'
              - '#deebf7'
              - '#c6dbef'
              - '#9ecae1'
              - '#6baed6'
              - '#4292c6'
              - '#2171b5'
              - '#08519c'
              - '#08306b'
            legend:
              title: '%'
              format: .0f
              orient: right
              gradientLength: 260
              titlePadding: 10
          tooltip:
          - field: state_name
            title: State
          - field: value_label
            title: Value (%)
          - field: reference_period
            title: Reference period
          - field: rank_desc
            title: Rank of 16 (1 = highest)
          - field: germany_value_label
            title: Germany (%)
          - field: diff_to_germany_label
            title: Difference to Germany
      - transform:
        - joinaggregate:
          - op: min
            field: value
            as: vmin
          - op: max
            field: value
            as: vmax
        - calculate: (datum.value - datum.vmin) / (datum.vmax - datum.vmin)
          as: color_pos
        mark:
          type: text
          fontSize: 10.5
          fontWeight: 600
