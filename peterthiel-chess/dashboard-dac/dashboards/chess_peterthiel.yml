        type: text
        col: 12
        content: |
          # Score through long public 3+0 sessions, 2016–2026

          **Among 755 sessions with at least ten games, the first game scored 58.7% (755 games), while game 21+ scored 53.8% (398 games across 71 sessions): a 4.9-point decline. The expected-score proxy stays near 53%, so this supports a session-position association—but cannot prove fatigue or continuous play.**

          **X-axis:** ordinal position in a 30-minute-gap-defined public session. **Y-axis:** score (% of possible points), fixed to 45–60%. **Lines:** sky blue = actual score; orange = rating-derived expected-score proxy.
