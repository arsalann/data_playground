name: Wikipedia AI Reference Report
description: |
  Sub-subject decomposition of AI-topic references across Wikipedia's
  Vital Articles (Level 4, ~9,907 articles, 11 top-level subjects),
  tracked across 14 semiannual snapshots from December 2019 to May 2026.
connection: bruin-playground-arsalan

rows:
  # ─────────────────────────────────────────────────────────────────────────────
  # Headline: biggest gainers since Dec 2019 (growth-from-baseline)
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Gainers header
        type: text
        col: 12
        content: |
          # Biggest gainers in AI-reference share since Dec 2019

          **Description.** Both charts start at zero on the December 2019 baseline and show the cumulative percentage-point change in AI-reference share at every snapshot.

          **Sources.** **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**, **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

  - widgets:
      - { name: t-gain-cat,    type: text, col: 6, content: "# By top-level subjects" }
      - { name: t-gain-subsub, type: text, col: 6, content: "# By sub-subjects (top 8 gainers)" }

  - widgets:
      - name: Gainers by category
        type: chart
        chart: line
        col: 6
        height: 587
        yMin: "0"
        hideName: true
        x: snapshot_label
        y: [cat_technology, cat_society, cat_arts, cat_mathematics, cat_people, cat_philosophy, cat_everyday, cat_geography, cat_biology, cat_physical, cat_history]
        yLabel: "Change in AI-reference share since Dec 2019 (pp)"
        seriesNames:
          cat_technology: "Technology"
          cat_society: "Society & social sciences"
          cat_arts: "Arts"
          cat_mathematics: "Mathematics"
          cat_people: "People"
          cat_philosophy: "Philosophy & religion"
          cat_everyday: "Everyday life"
          cat_geography: "Geography"
          cat_biology: "Biology & health"
          cat_physical: "Physical sciences"
          cat_history: "History"
        sql: |
          WITH per_snap AS (
            SELECT snapshot_date, subject,
              SAFE_DIVIDE(COUNTIF(ai_ref_count > 0), COUNT(*)) AS share,
              COUNT(*) AS n_articles,
              COUNTIF(ai_ref_count > 0) AS n_ai
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`
            GROUP BY snapshot_date, subject
          ),
          latest AS (SELECT MAX(snapshot_date) AS d FROM per_snap),
          eligible AS (
            SELECT p.subject
            FROM per_snap p, latest l
            WHERE p.snapshot_date = l.d AND p.n_articles >= 20 AND p.n_ai >= 1
          ),
          baseline AS (
            SELECT subject, share AS share_first
            FROM per_snap
            WHERE snapshot_date = '2019-12-01'
          ),
          delta AS (
            SELECT
              p.snapshot_date,
              p.subject,
              (p.share - COALESCE(b.share_first, p.share)) AS d_share
            FROM per_snap p
            JOIN eligible e USING (subject)
            LEFT JOIN baseline b USING (subject)
          )
          SELECT
            FORMAT_DATE('%b %Y', snapshot_date) AS snapshot_label,
            ROUND(MAX(CASE WHEN subject = 'Technology'                  THEN d_share END) * 100, 2) AS cat_technology,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' THEN d_share END) * 100, 2) AS cat_society,
            ROUND(MAX(CASE WHEN subject = 'Arts'                        THEN d_share END) * 100, 2) AS cat_arts,
            ROUND(MAX(CASE WHEN subject = 'Mathematics'                 THEN d_share END) * 100, 2) AS cat_mathematics,
            ROUND(MAX(CASE WHEN subject = 'People'                      THEN d_share END) * 100, 2) AS cat_people,
            ROUND(MAX(CASE WHEN subject = 'Philosophy and religion'     THEN d_share END) * 100, 2) AS cat_philosophy,
            ROUND(MAX(CASE WHEN subject = 'Everyday life'               THEN d_share END) * 100, 2) AS cat_everyday,
            ROUND(MAX(CASE WHEN subject = 'Geography'                   THEN d_share END) * 100, 2) AS cat_geography,
            ROUND(MAX(CASE WHEN subject = 'Biology and health sciences' THEN d_share END) * 100, 2) AS cat_biology,
            ROUND(MAX(CASE WHEN subject = 'Physical sciences'           THEN d_share END) * 100, 2) AS cat_physical,
            ROUND(MAX(CASE WHEN subject = 'History'                     THEN d_share END) * 100, 2) AS cat_history
          FROM delta
          GROUP BY snapshot_date
          ORDER BY snapshot_date

      - name: Gainers by sub-subject
        type: chart
        chart: line
        col: 6
        height: 587
        yMin: "0"
        hideName: true
        x: snapshot_label
        y: [soc_mass_media, soc_education, tech_internet, soc_busecon, tech_it, tech_electronics, arts_film, math_statistics]
        yLabel: "Change in AI-reference share since Dec 2019 (pp)"
        seriesNames:
          soc_mass_media: "Mass media (Society)"
          soc_education: "Education (Society)"
          tech_internet: "Internet culture - extended (Technology)"
          soc_busecon: "Business and economics (Society)"
          tech_it: "Computing and IT (Technology)"
          tech_electronics: "Electronics (Technology)"
          arts_film: "Film and television (Arts)"
          math_statistics: "Statistics and probability (Mathematics)"
        sql: |
          WITH per_snap AS (
            SELECT snapshot_date, subject, sub_subject,
              SAFE_DIVIDE(COUNTIF(ai_ref_count > 0), COUNT(*)) AS share,
              COUNT(*) AS n_articles,
              COUNTIF(ai_ref_count > 0) AS n_ai
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`
            GROUP BY snapshot_date, subject, sub_subject
          ),
          latest AS (SELECT MAX(snapshot_date) AS d FROM per_snap),
          eligible AS (
            SELECT p.subject, p.sub_subject
            FROM per_snap p, latest l
            WHERE p.snapshot_date = l.d AND p.n_articles >= 20 AND p.n_ai >= 1
          ),
          baseline AS (
            SELECT subject, sub_subject, share AS share_first
            FROM per_snap
            WHERE snapshot_date = '2019-12-01'
          ),
          delta AS (
            SELECT
              p.snapshot_date,
              p.subject,
              p.sub_subject,
              (p.share - COALESCE(b.share_first, p.share)) AS d_share
            FROM per_snap p
            JOIN eligible e USING (subject, sub_subject)
            LEFT JOIN baseline b USING (subject, sub_subject)
          )
          SELECT
            FORMAT_DATE('%b %Y', snapshot_date) AS snapshot_label,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Mass media'                            THEN d_share END) * 100, 2) AS soc_mass_media,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Education'                             THEN d_share END) * 100, 2) AS soc_education,
            ROUND(MAX(CASE WHEN subject = 'Technology'                   AND sub_subject = 'Internet culture (extended)'          THEN d_share END) * 100, 2) AS tech_internet,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Business and economics'               THEN d_share END) * 100, 2) AS soc_busecon,
            ROUND(MAX(CASE WHEN subject = 'Technology'                   AND sub_subject = 'Computing and information technology' THEN d_share END) * 100, 2) AS tech_it,
            ROUND(MAX(CASE WHEN subject = 'Technology'                   AND sub_subject = 'Electronics'                          THEN d_share END) * 100, 2) AS tech_electronics,
            ROUND(MAX(CASE WHEN subject = 'Arts'                         AND sub_subject = 'Film and television'                  THEN d_share END) * 100, 2) AS arts_film,
            ROUND(MAX(CASE WHEN subject = 'Mathematics'                  AND sub_subject = 'Statistics and probability'           THEN d_share END) * 100, 2) AS math_statistics
          FROM delta
          GROUP BY snapshot_date
          ORDER BY snapshot_date

  # ─────────────────────────────────────────────────────────────────────────────
  # Grid header
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Grid header
        type: text
        col: 12
        content: |
          # Sub-subject AI-reference share over time, by top-level subject (Dec 2019 – May 2026)

          **Description.** Each panel shows one top-level subject; lines inside are its top sub-subjects, plotting the share of articles with ≥1 AI reference at each semiannual snapshot. Y-axis is per-panel, so vertical scale differs between panels - compare shapes, not heights.

          **Sources.** **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**, **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

  # ─────────────────────────────────────────────────────────────────────────────
  # 6 × 2 small-multiples grid - ordered per user request
  # ─────────────────────────────────────────────────────────────────────────────

