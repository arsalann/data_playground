            value: 0
          text:
            field: germany_text
- tab: Economy
  widgets:
  - name: gdp_per_capita_footnote
    type: text
    col: 12
    content: |
      **Sources:** **[Arbeitskreis VGR der Länder, GDP release August 2025/February 2026](https://www.statistikportal.de/de/vgrdl/ergebnisse-laenderebene/bruttoinlandsprodukt-bruttowertschoepfung)**, licence dl-de/by-2-0; state boundaries **[Eurostat GISCO, NUTS 2024, 1:10 million](https://ec.europa.eu/eurostat/web/gisco/geodata/statistical-units/territorial-units-statistics)** (© EuroGeographics).

      **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

      **Limitations:** GDP is measured where it is produced (domestic concept) but divided by residents, so city-states with many in-commuters (Hamburg, Bremen, Berlin) are overstated relative to their residents' incomes. Current prices, not adjusted for regional price levels. 2025 values are the first VGRdL estimate and may be revised.
