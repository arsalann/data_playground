name: Wikipedia AI Trends
description: |
  How widely do English Wikipedia's Vital Articles (Level 4, ~9,907 articles
  across 11 top-level subjects) reference AI-topic articles, and how has that
  changed across semiannual snapshots from December 2019 through May 2026?
  An "AI reference" is a wikilink in the article body pointing to one of
  ~47 curated AI-topic articles (or any of their redirect aliases). Source
  tables in `bruin-playground-arsalan.report.wat_*`, populated by the
  `wikipedia-ai-trends` Bruin pipeline.
connection: bruin-playground-arsalan

rows:
  # ─────────────────────────────────────────────────────────────────────────────
  # Header
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: About
        type: text
        col: 12
        content: |
          # Wikipedia AI references — trends across subject areas, 2019–2026

          This dashboard tracks how often Wikipedia's Vital Articles (Level 4) —
          ~9,907 articles editorially curated as the most important topics
          across all of human knowledge — link to AI-topic articles such as
          *Artificial intelligence*, *Machine learning*, *Large language model*,
          *GPT-4*, and *Transformer (deep learning architecture)*. Each tracked
          article is snapshotted twice a year (May 1 and December 1) from
          December 2019 through May 2026, and the wikilinks present at each
          revision are joined against a curated list of 47 AI-topic seed
          articles plus their redirect aliases.

          The three analytical questions are:
          (1) which subject areas reference AI most, and least;
          (2) where the increase since 2019 has been fastest, slowest, or
          absent; and
          (3) which sub-subjects show unexpectedly high or low AI presence
          relative to their parent subject.

  # ─────────────────────────────────────────────────────────────────────────────
  # Headline metrics
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Articles tracked
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT COUNT(DISTINCT article_title) AS value
          FROM `bruin-playground-arsalan.staging.wat_universe`

      - name: AI seed articles
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT COUNT(DISTINCT canonical_title) AS value
          FROM `bruin-playground-arsalan.staging.wat_ai_articles`

      - name: Snapshot dates
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT COUNT(DISTINCT snapshot_date) AS value
          FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`

      - name: Latest cross-subject AI share
        type: metric
        col: 3
        column: value
        suffix: "%"
        format: number
        sql: |
          WITH latest AS (
            SELECT MAX(snapshot_date) AS d
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`
          )
          SELECT ROUND(100 * SAFE_DIVIDE(COUNTIF(ai_ref_count > 0), COUNT(*)), 2) AS value
          FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`, latest
          WHERE snapshot_date = latest.d

  # ─────────────────────────────────────────────────────────────────────────────
  # Prevalence by top-level subject (latest snapshot)
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Prevalence by subject header
        type: text
        col: 12
        content: |
          ## Share of articles that reference any AI-topic article, by top-level subject (latest snapshot)

          **Description.** Each bar shows the share of Vital-Articles-L4
          articles within a top-level subject that include at least one wikilink
          to an AI-topic article (canonical or redirect alias) at the latest
          snapshot. Subjects are sorted by AI-reference share, largest to
          smallest. The bar height directly answers "where on the Wikipedia
          knowledge map is AI most embedded?"

          **Encoding key.** **X axis:** top-level subject. **Y axis:** share of
          articles with ≥1 AI reference (%, 0–100). Subjects sorted descending
          by share.

  - widgets:
      - name: AI-reference prevalence by subject (% of articles with ≥1 AI ref, latest snapshot)
        type: chart
        chart: bar
        col: 12
        x: subject
        y: [share_with_ai_pct]
        sql: |
          WITH latest AS (
            SELECT MAX(snapshot_date) AS d
            FROM `bruin-playground-arsalan.report.wat_category_metrics`
          )
          SELECT
            c.subject,
            ROUND(c.share_with_ai * 100, 2) AS share_with_ai_pct,
            c.n_articles,
            c.articles_with_ai,
            ROUND(c.mean_ai_refs_per_article, 2) AS mean_ai_refs_per_article
          FROM `bruin-playground-arsalan.report.wat_category_metrics` c, latest
          WHERE c.snapshot_date = latest.d
          ORDER BY share_with_ai_pct DESC

  - widgets:
      - name: Prevalence by subject footnote
        type: text
        col: 12
        content: |
          **Sources.** **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          (universe; subject + sub-subject tags). Article wikilinks from the
          **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**
          (`action=query&prop=revisions&rvprop=content`), parsed for `[[…]]`
          links and joined against the curated AI seed list.

          **Tools.** **Bruin cli** (ingestion, staging, report), **BigQuery**
          (storage and joins), **Bruin dac** (visualization).

          **Limitations.** "AI reference" here is a structural wikilink to an
          AI-topic article — it is a proxy for editorial association, not a
          semantic or sentiment measure. The universe is the curated
          Vital-Articles-L4 list, not all of Wikipedia. Subjects vary in
          article count (~360 to ~2,000); share is normalized per subject but
          smaller subjects are noisier.

  # ─────────────────────────────────────────────────────────────────────────────
  # Trend over time
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Trend over time header
        type: text
        col: 12
        content: |
          ## AI-reference share over time, by top-level subject (Dec 2019 – May 2026)

          **Description.** Each line tracks one top-level subject's share of
          articles with ≥1 AI reference across 14 semiannual snapshots. A line
          rising steeply indicates a subject where AI has become more embedded
          in editorial cross-referencing; a flat line indicates editorial
          stasis. The vertical landmark to keep in mind is the public release
          of ChatGPT (November 2022) — the May-2023 snapshot is the first that
          fully reflects post-ChatGPT editing activity.

          The series are split into two panels by their share at the latest
          snapshot (May 2026): the upper panel shows the four subjects above
          5%, the lower panel shows the seven subjects below 5%. Splitting by
          magnitude lets each panel use a tighter y-range so year-over-year
          deltas are visible instead of compressed against the larger series.

          **Encoding key.** **X axis:** snapshot date (month + year). **Y axis:** share of
          articles with ≥1 AI reference (%). One line per top-level subject.
          Hover for exact values.

  - widgets:
      - name: Higher-share subjects (≥5% in May 2026)
        type: chart
        chart: line
        col: 12
        x: snapshot_label
        y:
          - mathematics
          - society_social_sciences
          - technology
          - philosophy_religion
        sql: |
          SELECT
            FORMAT_DATE('%b %Y', snapshot_date) AS snapshot_label,
            ROUND(MAX(CASE WHEN subject = 'Mathematics'                    THEN share_with_ai END) * 100, 2) AS mathematics,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences'    THEN share_with_ai END) * 100, 2) AS society_social_sciences,
            ROUND(MAX(CASE WHEN subject = 'Technology'                     THEN share_with_ai END) * 100, 2) AS technology,
            ROUND(MAX(CASE WHEN subject = 'Philosophy and religion'        THEN share_with_ai END) * 100, 2) AS philosophy_religion
          FROM `bruin-playground-arsalan.report.wat_category_metrics`
          GROUP BY snapshot_date
          ORDER BY snapshot_date

  - widgets:
      - name: Lower-share subjects (<5% in May 2026)
        type: chart
        chart: line
        col: 12
        x: snapshot_label
        y:
          - arts
          - everyday_life
          - geography
          - biology_health
          - people
          - physical_sciences
          - history
        sql: |
          SELECT
            FORMAT_DATE('%b %Y', snapshot_date) AS snapshot_label,
            ROUND(MAX(CASE WHEN subject = 'Arts'                           THEN share_with_ai END) * 100, 2) AS arts,
            ROUND(MAX(CASE WHEN subject = 'Everyday life'                  THEN share_with_ai END) * 100, 2) AS everyday_life,
            ROUND(MAX(CASE WHEN subject = 'Geography'                      THEN share_with_ai END) * 100, 2) AS geography,
            ROUND(MAX(CASE WHEN subject = 'Biology and health sciences'    THEN share_with_ai END) * 100, 2) AS biology_health,
            ROUND(MAX(CASE WHEN subject = 'People'                         THEN share_with_ai END) * 100, 2) AS people,
            ROUND(MAX(CASE WHEN subject = 'Physical sciences'              THEN share_with_ai END) * 100, 2) AS physical_sciences,
            ROUND(MAX(CASE WHEN subject = 'History'                        THEN share_with_ai END) * 100, 2) AS history
          FROM `bruin-playground-arsalan.report.wat_category_metrics`
          GROUP BY snapshot_date
          ORDER BY snapshot_date

  - widgets:
      - name: Trend over time footnote
        type: text
        col: 12
        content: |
          **Sources.** AI-reference counts derived from semiannual revision
          snapshots fetched via the **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**
          (`prop=revisions`, closest revision at or before each target date).
          Subject classification from **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** The earliest snapshot (Dec 2019) only covers
          articles that already existed at that date — some AI seed articles
          (e.g. *GPT-4*) had not been created yet, so apparent "growth" partly
          reflects the AI vocabulary expanding within Wikipedia itself, not
          only outside articles adopting new links. The snapshot interval
          (~6 months) is coarse: short-lived spikes between snapshots are
          invisible. The 5% threshold used to split the panels is the
          latest-snapshot value — a subject that crosses the threshold in
          future snapshots may want to be re-classified.

  # ─────────────────────────────────────────────────────────────────────────────
  # Growth comparison: earliest vs latest snapshot
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Growth comparison header
        type: text
        col: 12
        content: |
          ## Subject-level change in AI-reference share, 2019 → 2026

          **Description.** For each top-level subject, the table compares the
          share of articles with ≥1 AI reference at the December-2019 snapshot
          to the most recent snapshot, and reports the percentage-point
          change. Subjects are sorted by the absolute pp change.

          **Encoding key.** Columns: subject, share in Dec 2019 (%), share at
          latest snapshot (%), pp change, and article-count context.

  - widgets:
      - name: Subject-level change in AI-reference share, Dec 2019 → latest snapshot
        type: table
        col: 12
        sql: |
          WITH first_snap AS (
            SELECT
              subject,
              share_with_ai AS share_first,
              n_articles    AS n_articles_first
            FROM `bruin-playground-arsalan.report.wat_category_metrics`
            WHERE snapshot_date = '2019-12-01'
          ),
          latest AS (
            SELECT MAX(snapshot_date) AS d
            FROM `bruin-playground-arsalan.report.wat_category_metrics`
          ),
          last_snap AS (
            SELECT
              c.subject,
              c.share_with_ai AS share_last,
              c.n_articles    AS n_articles_last,
              c.snapshot_date AS latest_snapshot
            FROM `bruin-playground-arsalan.report.wat_category_metrics` c, latest
            WHERE c.snapshot_date = latest.d
          )
          SELECT
            l.subject                                                       AS subject,
            ROUND(f.share_first * 100, 2)                                   AS share_dec_2019_pct,
            ROUND(l.share_last  * 100, 2)                                   AS share_latest_pct,
            ROUND((l.share_last - f.share_first) * 100, 2)                  AS change_pp,
            f.n_articles_first                                              AS n_articles_dec_2019,
            l.n_articles_last                                               AS n_articles_latest,
            l.latest_snapshot                                               AS latest_snapshot
          FROM last_snap l
          LEFT JOIN first_snap f USING (subject)
          ORDER BY ABS(l.share_last - COALESCE(f.share_first, 0)) DESC
        columns:
          - {name: "subject", label: "Subject"}
          - {name: "share_dec_2019_pct", label: "Share Dec-2019 (%)", format: number}
          - {name: "share_latest_pct", label: "Share latest (%)", format: number}
          - {name: "change_pp", label: "Change (pp)", format: number}
          - {name: "n_articles_dec_2019", label: "N articles Dec-2019", format: number}
          - {name: "n_articles_latest", label: "N articles latest", format: number}
          - {name: "latest_snapshot", label: "Latest snapshot"}

  - widgets:
      - name: Growth comparison footnote
        type: text
        col: 12
        content: |
          **Sources.** Per-snapshot subject aggregates from
          `bruin-playground-arsalan.report.wat_category_metrics`, built from
          semiannual **[MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**
          snapshots over the **[Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          universe.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** Sharing the same denominator across two distant
          snapshots assumes the underlying Vital-Articles-L4 universe is
          stable; in practice editors add and remove articles from the list
          over years, and the article count column makes that drift visible.
          A subject whose article count grew substantially may show a falling
          share simply because new articles arrived without AI references.

  # ─────────────────────────────────────────────────────────────────────────────
  # Sub-subject drill-down
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Sub-subject drill-down header
        type: text
        col: 12
        content: |
          # Drill-down: sub-subjects within each top-level subject

          The charts above aggregate every Vital-Articles-L4 article up to its
          top-level subject. The sections below break those subjects open into
          their constituent sub-subjects (the second tier of the Vital Articles
          taxonomy), so a subject mean of 9.56% (Mathematics) can be decomposed
          into the specific themes that drive it.

  - widgets:
      - name: Sub-subject breakdown header
        type: text
        col: 12
        content: |
          ## Top 20 sub-subjects by AI-reference share (latest snapshot)

          **Description.** Sub-subjects are the second tier of the
          Vital-Articles-L4 taxonomy (each top-level subject is divided into
          ~5–15 themes). The bars below show the 20 sub-subjects with the
          highest share of articles linking to any AI-topic article at the
          latest snapshot, filtered to sub-subjects with at least 5 articles to
          suppress noise. This view answers "within the subjects with high AI
          presence, which specific themes drive it?"

          **Encoding key.** **X axis:** sub-subject (formatted as
          `subject › sub-subject`). **Y axis:** share of articles within that
          sub-subject with ≥1 AI reference (%, 0–100). Sorted descending. Note
          that sub-subject shares can be much higher than the parent subject
          mean — e.g. *Mathematics › Other* (7 of 13 articles, 53.85%) sits
          inside *Mathematics* whose overall share is 9.56%.

  - widgets:
      - name: Top 20 sub-subjects by AI-reference share (% of articles with ≥1 AI ref, latest snapshot)
        type: chart
        chart: bar
        col: 12
        x: sub_subject_label
        y: [share_with_ai_pct]
        sql: |
          SELECT
            CONCAT(subject, ' › ', sub_subject) AS sub_subject_label,
            ROUND(share_with_ai * 100, 2) AS share_with_ai_pct,
            n_articles,
            articles_with_ai,
            ROUND(mean_ai_refs_per_article, 2) AS mean_ai_refs_per_article
          FROM `bruin-playground-arsalan.report.wat_subcategory_metrics`
          ORDER BY share_with_ai_pct DESC
          LIMIT 20

  - widgets:
      - name: Sub-subject breakdown footnote
        type: text
        col: 12
        content: |
          **Sources.** Sub-subject labels parsed from level-3 headings within
          each **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          subject subpage. AI-reference counts derived from the
          **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** Sub-subjects with fewer than 5 articles are
          excluded — small denominators produce extreme shares that are not
          meaningful. The exact sub-subject names depend on Wikipedia editors'
          heading choices and may shift over time as the Vital Articles
          taxonomy is revised; the snapshot here uses the structure observed
          when the universe was scraped.

  # ─────────────────────────────────────────────────────────────────────────────
  # Sub-subject trend over time
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Sub-subject trend header
        type: text
        col: 12
        content: |
          ## AI-reference share over time, by sub-subject (Dec 2019 – May 2026)

          **Description.** The same trend view as the top-level chart above,
          but drilled down to the 16 sub-subjects with the highest
          AI-reference share at the latest snapshot. Each line tracks one
          sub-subject's share of articles with ≥1 AI reference across 14
          semiannual snapshots, computed directly from
          `staging.wat_ai_reference_counts` (sub-subject metrics were not
          materialized historically in `wat_subcategory_metrics`). The
          ChatGPT release landmark (Nov 2022 → May-2023 snapshot is the
          first post-ChatGPT view) applies here too.

          The series are split into two panels by their rank at the latest
          snapshot: the upper panel covers the top 8 sub-subjects (≥15%
          share at May 2026), the lower panel covers ranks 9–16 (≈10–15%
          share). Splitting at rank-8 keeps each panel within the Wong
          colorblind-safe palette of 8 distinct colors.

          **Encoding key.** **X axis:** snapshot date (month + year). **Y axis:** share of
          articles with ≥1 AI reference (%). One line per sub-subject;
          hover for exact values.

  - widgets:
      - name: Top 8 sub-subjects by AI-reference share (≥15% at May 2026)
        type: chart
        chart: line
        col: 12
        x: snapshot_label
        y:
          - mathematics_other
          - technology_engineering
          - mathematics_statistics_and_probability
          - technology_computing_and_it
          - philosophy_religion_philosophy
          - society_mass_media
          - society_psychology
          - history_auxiliary_historical_sciences
        sql: |
          WITH per_snap AS (
            SELECT
              snapshot_date,
              subject,
              sub_subject,
              SAFE_DIVIDE(COUNTIF(ai_ref_count > 0), COUNT(*)) AS share
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`
            GROUP BY snapshot_date, subject, sub_subject
          )
          SELECT
            FORMAT_DATE('%b %Y', snapshot_date) AS snapshot_label,
            ROUND(MAX(CASE WHEN subject = 'Mathematics'                 AND sub_subject = 'Other'                                  THEN share END) * 100, 2) AS mathematics_other,
            ROUND(MAX(CASE WHEN subject = 'Technology'                  AND sub_subject = 'Engineering'                            THEN share END) * 100, 2) AS technology_engineering,
            ROUND(MAX(CASE WHEN subject = 'Mathematics'                 AND sub_subject = 'Statistics and probability'             THEN share END) * 100, 2) AS mathematics_statistics_and_probability,
            ROUND(MAX(CASE WHEN subject = 'Technology'                  AND sub_subject = 'Computing and information technology'   THEN share END) * 100, 2) AS technology_computing_and_it,
            ROUND(MAX(CASE WHEN subject = 'Philosophy and religion'     AND sub_subject = 'Philosophy'                             THEN share END) * 100, 2) AS philosophy_religion_philosophy,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Mass media'                             THEN share END) * 100, 2) AS society_mass_media,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Psychology'                             THEN share END) * 100, 2) AS society_psychology,
            ROUND(MAX(CASE WHEN subject = 'History'                     AND sub_subject = 'Auxiliary historical sciences'          THEN share END) * 100, 2) AS history_auxiliary_historical_sciences
          FROM per_snap
          GROUP BY snapshot_date
          ORDER BY snapshot_date

  - widgets:
      - name: Next 8 sub-subjects by AI-reference share (≈10–15% at May 2026)
        type: chart
        chart: line
        col: 12
        x: snapshot_label
        y:
          - society_business_and_economics
          - society_education
          - physical_sciences_science_basics
          - technology_medical_technology
          - technology_electronics
          - biology_health_ecology
          - technology_navigation_and_timekeeping
          - arts_film_and_television
        sql: |
          WITH per_snap AS (
            SELECT
              snapshot_date,
              subject,
              sub_subject,
              SAFE_DIVIDE(COUNTIF(ai_ref_count > 0), COUNT(*)) AS share
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`
            GROUP BY snapshot_date, subject, sub_subject
          )
          SELECT
            FORMAT_DATE('%b %Y', snapshot_date) AS snapshot_label,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Business and economics'                 THEN share END) * 100, 2) AS society_business_and_economics,
            ROUND(MAX(CASE WHEN subject = 'Society and social sciences' AND sub_subject = 'Education'                              THEN share END) * 100, 2) AS society_education,
            ROUND(MAX(CASE WHEN subject = 'Physical sciences'           AND sub_subject = 'Science basics'                         THEN share END) * 100, 2) AS physical_sciences_science_basics,
            ROUND(MAX(CASE WHEN subject = 'Technology'                  AND sub_subject = 'Medical technology'                     THEN share END) * 100, 2) AS technology_medical_technology,
            ROUND(MAX(CASE WHEN subject = 'Technology'                  AND sub_subject = 'Electronics'                            THEN share END) * 100, 2) AS technology_electronics,
            ROUND(MAX(CASE WHEN subject = 'Biology and health sciences' AND sub_subject = 'Ecology'                                THEN share END) * 100, 2) AS biology_health_ecology,
            ROUND(MAX(CASE WHEN subject = 'Technology'                  AND sub_subject = 'Navigation and timekeeping'             THEN share END) * 100, 2) AS technology_navigation_and_timekeeping,
            ROUND(MAX(CASE WHEN subject = 'Arts'                        AND sub_subject = 'Film and television'                    THEN share END) * 100, 2) AS arts_film_and_television
          FROM per_snap
          GROUP BY snapshot_date
          ORDER BY snapshot_date

  - widgets:
      - name: Sub-subject trend footnote
        type: text
        col: 12
        content: |
          **Sources.** Per-article AI-reference counts from
          `bruin-playground-arsalan.staging.wat_ai_reference_counts`, joined
          back to the **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)**
          sub-subject taxonomy. Article wikilinks from the
          **[Wikipedia MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)**.

          **Tools.** **Bruin cli**, **BigQuery**, **Bruin dac**.

          **Limitations.** Sub-subjects are picked by their rank at the
          latest snapshot — a sub-subject that was high earlier and faded
          later won't appear. Small-denominator effects are stronger at the
          sub-subject level: *Mathematics › Other* (7 of 13 articles) and
          *Technology › Engineering* (4 of 13) have dramatic shares because
          their denominators are tiny, and a single article changing its
          links can move the line several percentage points between
          snapshots. Cross-reference against the article count in the
          earlier "Top 20 sub-subjects" bar chart for context.

  # ─────────────────────────────────────────────────────────────────────────────
  # Per-subject small multiples: one chart per top-level subject, lines per sub-subject
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Per-subject small multiples header
        type: text
        col: 12
        content: |
          ## AI-reference share over time, decomposed by sub-subject within each top-level subject

          **Description.** Eleven small line charts — one per top-level subject —
          each plotting the AI-reference share trend of that subject's top
          sub-subjects (ranked by latest snapshot share, restricted to
          sub-subjects with at least 5 articles, capped at 8 lines per panel
          to stay within the colorblind-safe palette). Where the trend chart
          earlier in the dashboard collapses each subject to a single line,
          this small-multiples view decomposes that line into the sub-themes
          driving it: e.g. *Mathematics* (overall ~9.56%) is carried by
          *Mathematics › Other* (53.85%) and *Statistics and probability*
          (23.08%). Panels are arranged left-to-right, top-to-bottom by
          subject-level latest share, highest first.

          **Encoding key.** **X axis (each panel):** snapshot date
          (month + year). **Y axis (each panel):** share of articles within
          that sub-subject with ≥1 AI reference (%). Each panel uses its own
          y-range so within-subject structure remains visible; cross-panel
          magnitudes are NOT directly comparable — refer to the summary
          table below for absolute levels.

  - widgets:
      - name: Per-subject summary
        type: table
        col: 12
        sql: |
          WITH latest AS (
            SELECT MAX(snapshot_date) AS d
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`
          ),
          per_sub AS (
            SELECT subject, sub_subject,
              SAFE_DIVIDE(COUNTIF(ai_ref_count > 0), COUNT(*)) AS share,
              COUNT(*) AS n
            FROM `bruin-playground-arsalan.staging.wat_ai_reference_counts`, latest
            WHERE snapshot_date = latest.d
            GROUP BY subject, sub_subject
          ),
          eligible AS (
            SELECT * FROM per_sub WHERE n >= 5
          ),
          ranked AS (
            SELECT subject, sub_subject, share, n,
              ROW_NUMBER() OVER (PARTITION BY subject ORDER BY share DESC) AS rk_top,
              ROW_NUMBER() OVER (PARTITION BY subject ORDER BY share ASC)  AS rk_bot
            FROM eligible
          ),
          top1 AS (SELECT subject, sub_subject AS top_sub, share AS top_share FROM ranked WHERE rk_top = 1),
          bot1 AS (SELECT subject, sub_subject AS bot_sub, share AS bot_share FROM ranked WHERE rk_bot = 1),
          counts AS (
            SELECT subject, COUNT(*) AS n_sub_subjects, SUM(n) AS n_articles_eligible
            FROM eligible GROUP BY subject
          ),
          subj_share AS (
            SELECT subject, share_with_ai AS subj_share
            FROM `bruin-playground-arsalan.report.wat_category_metrics`
            WHERE snapshot_date = (SELECT MAX(snapshot_date) FROM `bruin-playground-arsalan.report.wat_category_metrics`)
          )
          SELECT
            c.subject                                       AS subject,
            ROUND(s.subj_share * 100, 2)                    AS subject_share_pct,
            c.n_sub_subjects                                AS n_sub_subjects,
            c.n_articles_eligible                           AS n_articles_eligible,
            t.top_sub                                       AS leading_sub_subject,
            ROUND(t.top_share * 100, 2)                     AS leading_share_pct,
            b.bot_sub                                       AS trailing_sub_subject,
            ROUND(b.bot_share * 100, 2)                     AS trailing_share_pct,
            ROUND((t.top_share - b.bot_share) * 100, 2)     AS spread_pp
          FROM counts c
          JOIN top1 t USING (subject)
          JOIN bot1 b USING (subject)
          JOIN subj_share s USING (subject)
          ORDER BY s.subj_share DESC
        columns:
          - {name: "subject", label: "Subject"}
          - {name: "subject_share_pct", label: "Subject share (%)", format: number}
          - {name: "n_sub_subjects", label: "Sub-subjects (≥5 articles)", format: number}
          - {name: "n_articles_eligible", label: "N articles (eligible)", format: number}
          - {name: "leading_sub_subject", label: "Leading sub-subject"}
          - {name: "leading_share_pct", label: "Leading share (%)", format: number}
          - {name: "trailing_sub_subject", label: "Trailing sub-subject"}
          - {name: "trailing_share_pct", label: "Trailing share (%)", format: number}
          - {name: "spread_pp", label: "Within-subject spread (pp)", format: number}

