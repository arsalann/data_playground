  # ─────────────────────────────────────────────────────────────────────────────
  # Methodology
  # ─────────────────────────────────────────────────────────────────────────────
  - widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          ## Methodology

          **Universe.** **[Wikipedia Vital Articles / Level 4](https://en.wikipedia.org/wiki/Wikipedia:Vital_articles/Level/4)** - ~9,907 articles curated as the most important topics across human knowledge, organised into 11 top-level subjects and ~120 sub-subjects.

          **AI seed list.** ~47 curated AI-topic articles spanning foundations (Artificial intelligence, Machine learning, Neural network, Deep learning), architectures (Transformer, RNN, CNN), modern systems (Large language model, GPT-4, ChatGPT, Claude, Gemini), companies (OpenAI, Anthropic, DeepMind), sub-fields (NLP, Computer vision, Reinforcement learning), and cultural/policy topics. Each canonical title is expanded with its current redirect aliases.

          **Snapshots.** 14 semiannual snapshots at fixed dates (December 1 and May 1, Dec-2019 through May-2026). For each (article × date), the **[MediaWiki Action API](https://www.mediawiki.org/wiki/API:Main_page)** returns the closest revision at or before the target date; body wikilinks are intersected with the AI alias list to count "AI references".

          **Pipeline.** Raw scrapes (`raw.wat_*`) → staging joins (`staging.wat_*`) → subject/sub-subject/article aggregates (`report.wat_*`). All assets run via **Bruin cli** on **BigQuery**; this dashboard renders via **Bruin dac**.

          **General limitations.** AI reference is a structural wikilink, not a semantic measure. Universe is curated Vital Articles L4, not all of Wikipedia. Some AI seed articles did not exist in 2019 (e.g. *GPT-4* page created in 2023); apparent growth partly reflects new AI vocabulary entering Wikipedia. English Wikipedia only. ~6-month snapshot cadence - short-lived spikes are not visible.
