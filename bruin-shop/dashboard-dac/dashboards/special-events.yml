name: Bruin Shop Special Events
description: Synthetic campaign wins, failed spend, outage, stockout, and defect incidents.
connection: bruin-playground-arsalan
theme: ibm-cb-dark

filters:
  - name: date_range
    type: date-range
    default: all_time
  - name: channel
    type: select
    default: All channels
    options:
      values: [All channels, Paid social, Paid search, Email, Organic search, Direct]
  - name: event_type
    type: select
    default: All event types
    options:
      values: [All event types, Failed campaign, Stockout campaign, Website outage, Successful campaign, Product defect]

rows:
  - widgets:
      - name: Special events overview
        type: text
        col: 12
        content: |
          # Special event analysis

          This page isolates the generated business incidents added to the apparel model: a failed Google campaign, a 12-hour website outage with recovery, an Instagram stockout campaign, two successful short campaigns, and a product-defect refund spike. Use the filters to narrow the analysis by date range, channel, or event type.

  - widgets:
      - name: Events in scope
        type: metric
        col: 3
        column: value
        format: number
        sql: |
          SELECT COUNT(*) AS value
          FROM `bruin-playground-arsalan.reports.rpt_special_event_impact`
          WHERE event_start_date <= COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND event_end_date >= COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')
            AND (
              '{{ filters.event_type }}' = 'All event types'
              OR event_type = CASE '{{ filters.event_type }}'
                WHEN 'Failed campaign' THEN 'failed_campaign'
                WHEN 'Stockout campaign' THEN 'stockout_campaign'
                WHEN 'Website outage' THEN 'website_outage'
                WHEN 'Successful campaign' THEN 'successful_campaign'
                WHEN 'Product defect' THEN 'product_defect'
              END
            )
            AND (
              '{{ filters.channel }}' = 'All channels'
              OR primary_channel = 'all_channels'
              OR primary_channel = CASE '{{ filters.channel }}'
                WHEN 'Paid social' THEN 'paid_ads'
                WHEN 'Paid search' THEN 'paid_search'
                WHEN 'Email' THEN 'email'
                WHEN 'Organic search' THEN 'organic_search'
                WHEN 'Direct' THEN 'direct'
              END
            )

      - name: Event revenue delta
        type: metric
        col: 3
        column: value
        prefix: "$"
        format: number
        sql: |
          SELECT ROUND(SUM(revenue_delta_vs_baseline), 2) AS value
          FROM `bruin-playground-arsalan.reports.rpt_special_event_impact`
          WHERE event_start_date <= COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.end }}', '') AS DATE), DATE '2026-06-05')
            AND event_end_date >= COALESCE(SAFE_CAST(NULLIF('{{ filters.date_range.start }}', '') AS DATE), DATE '2025-01-01')

      - name: Worst refund rate
        type: metric
        col: 3
        column: value
        suffix: "%"
        format: number
        sql: |
          SELECT ROUND(MAX(refund_rate_pct), 2) AS value
          FROM `bruin-playground-arsalan.reports.rpt_special_event_impact`

      - name: Stockout waste spend
        type: metric
        col: 3
        column: value
        prefix: "$"
        format: number
        sql: |
          SELECT ROUND(SUM(spend), 2) AS value
          FROM `bruin-playground-arsalan.staging.stg_marketing_spend`
          WHERE special_event_id = 'instagram_trail_shoe_stockout'
            AND event_phase = 'stockout_waste'

  - widgets:
      - name: Event timeline header
        type: text
        col: 12
        content: |
          # Daily revenue during selected event windows

          **The generated incidents create visible operational signatures: the successful campaigns lift revenue temporarily, the outage suppresses sales, and the stockout campaign keeps spend high while order volume falls in the final phase.**

          **X-axis:** calendar day. **Y-axis:** net revenue in USD. **Line:** daily revenue for the selected filter scope.

  - widgets:
      - name: Daily revenue and sessions
        type: chart
        chart: line
        col: 12
        file: queries/event_daily_revenue_sessions.sql
        x: day_label
        y: [net_revenue_usd]

  - widgets:
      - name: Event timeline footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Shopify** orders and **GA4** sessions generated from `raw.marketing_funnel`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Revenue and sessions are deterministic fake data. Sessions are not overlaid here because this DAC binary does not expose dual axes; the outage section shows sessions at hourly grain.

  - widgets:
      - name: Paid efficiency header
        type: text
        col: 12
        content: |
          # Paid campaign CTR and click-to-order rate (%)

          **The failed Google campaign shows the opposite pattern from the two winning campaigns: spend rises while CTR and click-to-order rate compress. The stockout campaign's final phase keeps clicks coming but nearly eliminates orders, creating wasted spend.**

          **X-axis:** calendar day. **Y-axis:** rate in percent. **Lines:** CTR and click-to-order conversion rate; the legend names both series.

  - widgets:
      - name: Paid campaign efficiency
        type: chart
        chart: combo
        col: 12
        file: queries/paid_event_efficiency_daily.sql
        x: day_label
        y: [click_through_rate_pct, click_to_order_rate_pct]
        lines: [click_through_rate_pct, click_to_order_rate_pct]

  - widgets:
      - name: Paid efficiency footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Google Ads**, **Meta Ads**, **GA4**, and **Shopify** rows summarized in `reports.rpt_marketing_roi`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** Campaign efficiency is generated by deterministic multipliers, not auction logs or incrementality tests. The rates are useful for testing anomaly narratives, not for estimating real media performance.

  - widgets:
      - name: Outage header
        type: text
        col: 12
        content: |
          # Website outage hourly sessions, 2026-02-04 to 2026-02-05

          **The outage is modeled at hourly grain: traffic falls close to zero for 12 UTC hours on 2026-02-04, then a smaller 2026-02-05 bump captures customers who returned to complete shopping.**

          **X-axis:** UTC hour. **Y-axis:** sessions. **Line:** hourly sessions across the outage and recovery period.

  - widgets:
      - name: Website outage hourly traffic
        type: chart
        chart: line
        col: 12
        file: queries/website_outage_hourly.sql
        x: hour_label
        y: [sessions]

  - widgets:
      - name: Outage footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake hourly **GA4** traffic from `raw.ga4_hourly_sessions`, derived from the shared funnel.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** The outage hour distribution is synthetic and UTC-based. Daily sessions remain reconciled to the generated funnel, but no real monitoring, CDN, or application logs are modeled.

  - widgets:
      - name: Defect header
        type: text
        col: 12
        content: |
          # Product refund rate during the defect window (%), 2026-02-20 to 2026-02-24

          **The Black Tote Bag defect incident is intentionally extreme: the affected item is partially refunded on more than 90% of orders, while other products keep the normal low refund-rate pattern.**

          **X-axis:** product. **Y-axis:** partially refunded orders divided by orders, expressed as a percentage. **Bars:** refund rate by product in the defect window.

  - widgets:
      - name: Product defect refund rate
        type: chart
        chart: bar
        col: 12
        file: queries/product_defect_refund_rate.sql
        x: product_name
        y: [refund_rate_pct]

  - widgets:
      - name: Defect footnote
        type: text
        col: 12
        content: |
          **Sources:** Fake same-schema **Shopify** orders and product catalog fields from `staging.stg_orders` and `staging.stg_products`.

          **Tools:** **Bruin cli** (pipeline), **BigQuery** (warehouse), **Bruin dac** (visualization).

          **Limitations:** The template uses `partially_refunded` as the refund signal; it does not include a refund transaction ledger, reason-code taxonomy, or SKU-level line-item arrays.

  - widgets:
      - name: Event summary header
        type: text
        col: 12
        content: |
          # Special event outcome table

          **The table separates generated event mechanics from observed-looking outcomes: failed campaigns have weak CTR/conversion economics, stockout waste has spend without matching orders, the outage loses sessions, winning campaigns produce short revenue bumps, and the defect incident shows the refund spike.**

          **Columns:** event, type, date range, channel, affected product, spend, impressions, clicks, conversions, sessions, orders, refunds, revenue, contribution profit, rates, baseline deltas, and expected effect.

  - widgets:
      - name: Special event outcomes
        type: table
        col: 12
        file: queries/special_event_summary.sql
        columns:
          - { name: event_name, label: Event }
          - { name: event_type, label: Type }
          - { name: start_date, label: Start date }
          - { name: end_date, label: End date }
          - { name: channel, label: Channel }
          - { name: affected_product, label: Product }
          - { name: spend_usd, label: "Spend (USD)", format: number }
          - { name: impressions, label: Impressions, format: number }
          - { name: clicks, label: Clicks, format: number }
          - { name: platform_conversions, label: Platform conversions, format: number }
          - { name: sessions, label: Sessions, format: number }
          - { name: paid_orders, label: Paid orders, format: number }
          - { name: refunded_orders, label: Refunded orders, format: number }
          - { name: revenue_usd, label: "Revenue (USD)", format: number }
          - { name: contribution_profit_usd, label: "Contribution profit (USD)", format: number }
          - { name: ctr_pct, label: "CTR (%)", format: number }
          - { name: conversion_rate_pct, label: "Conversion rate (%)", format: number }
          - { name: refund_rate_pct, label: "Refund rate (%)", format: number }
          - { name: revenue_delta_vs_baseline_usd, label: "Revenue delta vs baseline (USD)", format: number }
          - { name: sessions_delta_vs_baseline, label: "Sessions delta vs baseline", format: number }
          - { name: expected_effect, label: Expected effect }

  - widgets:
      - name: Methodology
        type: text
        col: 12
        content: |
          # Methodology

          `raw.special_events` defines event windows and affected channels/products. `raw.marketing_funnel` applies deterministic spend, impression, CTR, conversion, session, and recovery multipliers, then ad, GA4, and Shopify-style raw assets inherit those values. `raw.shopify_orders` forces the Instagram stockout launch product during the launch phase, stops assigning that shoe after the stockout date, and marks the defective tote bag as partially refunded for more than 90% of affected orders. `raw.ga4_hourly_sessions` distributes daily sessions into hourly buckets to make the 12-hour outage visible at the correct grain. `reports.rpt_special_event_impact` aggregates event outcomes and compares them with an immediately prior same-length baseline window.
