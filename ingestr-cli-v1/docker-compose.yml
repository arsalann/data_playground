services:
  ingestr-cli-v1-postgres:
    image: postgres:16-alpine
    container_name: ingestr-cli-v1-postgres
    environment:
      POSTGRES_USER: ingestr_cli_v1
      POSTGRES_PASSWORD: ingestr_cli_v1
      POSTGRES_DB: ingestr_cli_v1
    ports:
      - "55433:5432"
    volumes:
      - ingestr-cli-v1-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestr_cli_v1 -d ingestr_cli_v1"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  ingestr-cli-v1-pgdata:
